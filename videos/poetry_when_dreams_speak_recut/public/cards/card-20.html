<div class="card" data-card-id="card-20">
  <style>
    .card[data-card-id="card-20"] .root {
      width: 100%; height: 100%; position: relative; overflow: hidden;
      background: #ffffff; color: #111;
      font-family: 'Inter', ui-sans-serif, sans-serif;
      display: flex; flex-direction: column; justify-content: center;
      padding: 64px 76px; box-sizing: border-box; gap: 30px;
    }
    .card[data-card-id="card-20"] .row {
      font: 800 62px/1.1 'Inter', sans-serif; color: #111; letter-spacing: -0.015em;
    }
    .card[data-card-id="card-20"] .row .neq { color: #e8190f; padding: 0 10px; }
    .card[data-card-id="card-20"] .row .soft { color: #8a8a8a; font-weight: 600; }
    .card[data-card-id="card-20"] .divider { width: 100%; border-top: 3px solid #111; border-bottom: 1px solid #111; height: 5px; }
    .card[data-card-id="card-20"] .title {
      margin: 0; font: 800 68px/1.1 'Inter', sans-serif; color: #111;
    }
    .card[data-card-id="card-20"] .title .hl { border-bottom: 7px solid #e8190f; }
    .card[data-card-id="card-20"] .detail { margin: 0; font: 500 32px/1.3 'Inter', sans-serif; color: #6d6d6d; }
  </style>
  <div class="root">
    <span class="row" data-anim="slide-in" data-anim-at="0.2" data-anim-duration="0.5" data-anim-from="left" data-anim-distance="50">SAFE <span class="neq">&ne;</span> <span class="soft">unchanged</span></span>
    <span class="row" data-anim="slide-in" data-anim-at="0.7" data-anim-duration="0.5" data-anim-from="left" data-anim-distance="50">ALIVE <span class="neq">&ne;</span> <span class="soft">reckless</span></span>
    <div class="divider" data-anim="fade-in" data-anim-at="1.3" data-anim-duration="0.4"></div>
    <h2 class="title" data-anim="fade-in" data-anim-at="1.6" data-anim-duration="0.55">they live in <span class="hl">the same moment</span></h2>
    <p class="detail" data-anim="fade-in" data-anim-at="2.3" data-anim-duration="0.5">you stop being divided. you just love them.</p>
  </div>
</div>
