<div class="card" data-card-id="card-10">
  <style>
    .card[data-card-id="card-10"] .root {
      width: 100%; height: 100%; position: relative; overflow: hidden;
      background: #f7f3e8; color: #22303f;
      font-family: 'Inter', ui-sans-serif, sans-serif;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 36px 96px; box-sizing: border-box; gap: 24px;
      background-image: repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(37, 87, 167, 0.08) 40px);
    }
    .card[data-card-id="card-10"] .title {
      margin: 0; font: 700 62px/1.15 ui-serif, serif; color: #22303f; text-align: center;
    }
    .card[data-card-id="card-10"] .title .hl {
      background: linear-gradient(transparent 58%, rgba(37, 87, 167, 0.22) 58%); padding: 0 4px;
    }
    .card[data-card-id="card-10"] .chips { display: flex; gap: 22px; }
    .card[data-card-id="card-10"] .chip {
      padding: 14px 28px; border: 2px solid #2557a7; border-radius: 999px;
      font: 600 27px/1 'Inter', sans-serif; color: #2557a7; background: rgba(37, 87, 167, 0.06);
    }
    .card[data-card-id="card-10"] .plus { font: 800 34px/1 'Inter', sans-serif; color: #22303f; align-self: center; }
  </style>
  <div class="root">
    <h2 class="title" data-anim="fade-in" data-anim-at="0.15" data-anim-duration="0.5">They hold you <span class="hl">steady</span> while you <span class="hl">expand</span></h2>
    <div class="chips">
      <span class="chip" data-anim="slide-in" data-anim-at="0.8" data-anim-duration="0.5" data-anim-from="left" data-anim-distance="40">nervous system relaxes</span>
      <span class="plus" data-anim="fade-in" data-anim-at="1.2" data-anim-duration="0.3">+</span>
      <span class="chip" data-anim="slide-in" data-anim-at="1.3" data-anim-duration="0.5" data-anim-from="right" data-anim-distance="40">aliveness opens up</span>
    </div>
  </div>
</div>
