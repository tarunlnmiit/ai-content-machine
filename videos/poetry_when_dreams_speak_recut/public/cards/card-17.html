<div class="card" data-card-id="card-17">
  <style>
    .card[data-card-id="card-17"] .root {
      width: 100%; height: 100%; position: relative; overflow: hidden;
      background: #efe6d0; color: #2b2318;
      font-family: 'Inter', ui-sans-serif, sans-serif;
      display: flex; flex-direction: column; justify-content: center;
      padding: 36px 110px; box-sizing: border-box; gap: 20px;
      border-top: 6px double #8b1d1d;
    }
    .card[data-card-id="card-17"] .kicker {
      font: 800 19px/1 ui-serif, serif; letter-spacing: 0.34em; color: #8b1d1d;
    }
    .card[data-card-id="card-17"] .title {
      margin: 0; font: 700 52px/1.22 ui-serif, serif; color: #2b2318; max-width: 1560px;
      text-align: justify;
    }
    .card[data-card-id="card-17"] .title .hl { color: #8b1d1d; font-style: italic; }
    .card[data-card-id="card-17"] .chips { display: flex; gap: 18px; }
    .card[data-card-id="card-17"] .chip {
      padding: 10px 22px; border: 2px solid #8b1d1d;
      font: 700 24px/1 ui-serif, serif; color: #8b1d1d;
      transform: rotate(-1deg);
    }
  </style>
  <div class="root">
    <span class="kicker" data-anim="fade-in" data-anim-at="0.15" data-anim-duration="0.4">THE EMBARRASSMENT IS THE KEY</span>
    <h2 class="title" data-anim="fade-in" data-anim-at="0.5" data-anim-duration="0.6">the vulnerability of <span class="hl">wanting something so badly</span> you can already feel its texture</h2>
    <div class="chips">
      <span class="chip" data-anim="scale-pop" data-anim-at="1.3" data-anim-duration="0.45">already taste it</span>
      <span class="chip" data-anim="scale-pop" data-anim-at="1.7" data-anim-duration="0.45">would risk everything for it</span>
    </div>
  </div>
</div>
