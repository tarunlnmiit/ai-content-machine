<!doctype html><html><head><meta charset="utf-8">
<title>Poetry Carousel Sample — Illuminated Manuscript Hook (Drop Cap)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:420px;height:525px;overflow:hidden;}
body{position:relative;}
.progress-row{position:absolute;top:0;left:0;right:0;display:flex;gap:4px;padding:8px 12px 0;z-index:20;}
.progress-seg{flex:1;height:3px;border-radius:2px;background:rgba(0,0,0,.12);overflow:hidden;}
.progress-seg .fill{height:100%;border-radius:2px;}
.counter-chip{position:absolute;top:18px;left:18px;background:rgba(30,27,46,.88);color:#EDE8DC;
  font-size:11px;font-weight:600;padding:5px 10px;border-radius:20px;letter-spacing:.03em;z-index:20;
  font-family:'Space Grotesk',sans-serif;}
.follow-tag{position:absolute;top:18px;right:18px;font-size:10.5px;font-weight:600;color:#8A6E30;
  background:rgba(255,255,255,.75);padding:5px 10px;border-radius:20px;letter-spacing:.02em;z-index:20;
  font-family:'Space Grotesk',sans-serif;}
.swipe-arrow{position:absolute;top:50%;right:18px;transform:translateY(-50%);width:38px;height:38px;
  border-radius:50%;background:#8A6E30;color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;box-shadow:0 8px 18px rgba(0,0,0,.3);z-index:20;}
.save-tag{position:absolute;bottom:18px;right:18px;font-size:10px;font-weight:600;color:#8A6E30;
  background:rgba(255,255,255,.75);padding:5px 9px;border-radius:6px;letter-spacing:.03em;z-index:20;
  font-family:'Space Grotesk',sans-serif;}
.cliffhanger{position:absolute;bottom:17px;left:0;right:0;text-align:center;font-size:9.5px;
  letter-spacing:.05em;text-transform:uppercase;z-index:20;font-family:'Space Grotesk',sans-serif;
  color:#8A6E30;opacity:.85;}

body{background:#EDE8DC;background-image:radial-gradient(rgba(138,110,48,.05) 1px,transparent 1px);background-size:5px 5px;}
.title{position:absolute;top:60px;left:18px;right:18px;font-family:'DM Sans',sans-serif;font-size:10.5px;
  font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#8A6E30;}
.dropcap{position:absolute;top:108px;left:18px;font-family:'Playfair Display',serif;font-weight:700;font-size:108px;
  line-height:.82;color:#B89850;text-shadow:1px 1px 0 #8A6E30, 2px 2px 6px rgba(138,110,48,.25);}
.stanza{position:absolute;top:150px;left:112px;right:24px;font-family:'Playfair Display',serif;font-style:italic;
  font-size:16px;line-height:1.65;color:#1E1B2E;}
.flourish{position:absolute;top:296px;left:18px;font-family:'Playfair Display',serif;font-size:20px;color:#B89850;}

</style></head><body>
<div class="progress-row"><div class="progress-seg"><div class="fill" style="width:100%;background:rgba(0,0,0,.42)"></div></div><div class="progress-seg"><div class="fill" style="width:0%;background:rgba(0,0,0,.42)"></div></div><div class="progress-seg"><div class="fill" style="width:0%;background:rgba(0,0,0,.42)"></div></div><div class="progress-seg"><div class="fill" style="width:0%;background:rgba(0,0,0,.42)"></div></div><div class="progress-seg"><div class="fill" style="width:0%;background:rgba(0,0,0,.42)"></div></div><div class="progress-seg"><div class="fill" style="width:0%;background:rgba(0,0,0,.42)"></div></div><div class="progress-seg"><div class="fill" style="width:0%;background:rgba(0,0,0,.42)"></div></div><div class="progress-seg"><div class="fill" style="width:0%;background:rgba(0,0,0,.42)"></div></div></div>
<div class="counter-chip">1 / 8</div>
<div class="follow-tag">Tap to follow &rarr;</div>
<div class="swipe-arrow">&rarr;</div>
<div class="save-tag">Save this &darr;</div>


<div class="title">The Room No One Entered</div>
<div class="dropcap">I</div>
<div class="stanza">pass the salt before they ask.<br>I laugh at the right moment.<br>I know which mug is whose.</div>
<div class="flourish">&#10087;</div>

</body></html>
