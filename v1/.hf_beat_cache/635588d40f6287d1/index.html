<!DOCTYPE html>
<html data-composition-fps="30" data-composition-duration="270" data-composition-variables='{"caption_text": {"type": "string", "default": "the mnemonic I use personally is axis 0 goes down, axis 1 goes across."}, "niche_color": {"type": "string", "default": "#3b82f6"}}'>
<head>
<meta charset="utf-8">
<style>
  /* === Python-owned base === */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    background: transparent;
    overflow: hidden;
  }
  #main {
    position: relative;
    width: 1920px; height: 1080px;
    overflow: hidden;
  }
  
    /* === Python-owned panel geometry === */
    #panel {
      position: absolute;
      left: 0px; top: 810px;
      width: 1920px; height: 270px;
      overflow: hidden;
      border-radius: 20px 20px 0 0;
      background: rgba(17,24,39,0.88);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 8px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    /* Specular highlight at panel top edge */
    #panel::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.14), transparent);
      z-index: 100;
    }
    /* Claude's content is scoped here. (0,0) = panel top-left. */
    #content {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
  
  
    /* === Python-owned caption (sibling of #panel, never clipped) === */
    #caption-layer {
      position: absolute;
      left: 0px; width: 1920px;
      bottom: 282px;
      display: flex; justify-content: center; align-items: flex-end;
      pointer-events: none;
    }
  /* Caption pill */
  #caption-pill {
    max-width: 1800px;
    padding: 12px 24px;
    border-radius: 10px;
    background: rgba(10,14,26,0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #f0f4ff;
    font: 600 30px/1.4 'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  #caption-pill .w {
    display: inline-block;
    margin: 0 3px;
    opacity: 0;
  }
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-duration="9.000" data-width="1920" data-height="1080">
  
  <div id="panel">
    <div id="content">
      <div style="position:absolute;top:0;left:0;width:1920px;height:270px;background:#0a0e1a;overflow:hidden;">
        <div class="accent-line" style="position:absolute;left:200px;top:135px;width:6px;height:80px;transform-origin:top center;background:linear-gradient(180deg,#3b82f6,#8b5cf6,#06b6d4);border-radius:3px;box-shadow:0 0 24px rgba(59,130,246,0.7);"></div>
        <div class="line1" style="position:absolute;left:240px;top:148px;max-width:1500px;font-family:Inter,'SF Pro Display','Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:68px;letter-spacing:-0.02em;line-height:1.2;word-wrap:break-word;overflow-wrap:break-word;background:linear-gradient(135deg,#3b82f6,#8b5cf6,#06b6d4);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;text-shadow:0 0 30px rgba(59,130,246,0.3);">axis 0 &#8595; rows</div>
        <div class="line2" style="position:absolute;left:240px;top:148px;max-width:1500px;font-family:Inter,'SF Pro Display','Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:68px;letter-spacing:-0.02em;line-height:1.2;word-wrap:break-word;overflow-wrap:break-word;background:linear-gradient(135deg,#06b6d4,#3b82f6,#8b5cf6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;text-shadow:0 0 30px rgba(6,182,212,0.3);">axis 1 &#8594; columns</div>
      </div>
    </div>
  </div>
  <div id="caption-layer"><div id="caption-pill"><span class="w">the</span><span class="w">mnemonic</span><span class="w">I</span><span class="w">use</span><span class="w">personally</span><span class="w">is</span><span class="w">axis</span><span class="w">0</span><span class="w">goes</span><span class="w">down,</span><span class="w">axis</span><span class="w">1</span><span class="w">goes</span><span class="w">across.</span></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
(function () {
  var vars = window.__hyperframes && window.__hyperframes.getVariables
    ? window.__hyperframes.getVariables() : {};
  var tl = gsap.timeline();
  var root = document.getElementById('content');

  /* ── Claude's content timeline (scoped to #content) ── */
  (function (tl, root, vars) {
      gsap.set(root.querySelector('.accent-line'), { scaleY: 0, opacity: 0 });
      gsap.set(root.querySelector('.line1'), { opacity: 0, y: 20, scale: 0.92 });
      gsap.set(root.querySelector('.line2'), { opacity: 0, y: 20, scale: 0.92 });
      
      tl.to(root.querySelector('.accent-line'), { scaleY: 1, opacity: 1, duration: 0.5, ease: 'cubic-bezier(0.34,1.56,0.64,1)' }, 0.0);
      tl.to(root.querySelector('.line1'), { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'cubic-bezier(0.34,1.56,0.64,1)' }, 0.1);
      
      tl.to(root.querySelector('.line1'), { opacity: 0.25, duration: 0.4, ease: 'cubic-bezier(0.4,0,1,1)' }, 1.7);
      tl.to(root.querySelector('.line2'), { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'cubic-bezier(0.34,1.56,0.64,1)' }, 1.8);
      
      tl.to([root.querySelector('.line2'), root.querySelector('.accent-line')], { opacity: 0, y: -16, duration: 0.25, ease: 'cubic-bezier(0.4,0,1,1)' }, 8.4);
  })(tl, root, vars);

  /* ── Caption timeline (Python-owned) ── */
  (function (tl) {
          var cw = document.querySelectorAll('#caption-pill .w');
          gsap.set(cw, { opacity: 0, y: 8 });
          tl.to(cw, { opacity: 1, y: 0, duration: 0.25, stagger: 0.1, ease: 'power2.out' }, 0.2);
  })(tl);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
