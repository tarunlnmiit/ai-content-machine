<!DOCTYPE html>
<html data-composition-fps="30" data-composition-duration="228" data-composition-variables='{"caption_text": {"type": "string", "default": "all over the hearts of the good ones praising the false gods demeaning deserving humans"}, "niche_color": {"type": "string", "default": "#3b82f6"}}'>
<head>
<meta charset="utf-8">
<style>
  /* === Python-owned base === */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    background: transparent;
    overflow: hidden;
  }
  #main {
    position: relative;
    width: 1920px; height: 1080px;
    overflow: hidden;
  }
  
    /* === Fullscreen layout === */
    #panel {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #content {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
  
  
    /* === Python-owned caption (fullscreen) === */
    #caption-layer {
      position: absolute;
      left: 0; right: 0;
      bottom: 80px;
      display: flex; justify-content: center; align-items: flex-end;
      pointer-events: none;
    }
  /* Caption pill */
  #caption-pill {
    max-width: 1860px;
    padding: 12px 24px;
    border-radius: 10px;
    background: rgba(10,14,26,0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #f0f4ff;
    font: 600 30px/1.4 'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  #caption-pill .w {
    display: inline-block;
    margin: 0 3px;
    opacity: 0;
  }
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-duration="7.600" data-width="1920" data-height="1080">
  
  <div id="panel">
    <div id="content">
      <div style="position:absolute; left:0; top:0; width:1920px; height:1080px; overflow:hidden; background:rgba(10,8,5,0.55); font-family:'Cormorant Garamond','Garamond','Georgia','Times New Roman',serif;">
        <div class="fog1" style="position:absolute; left:-200px; top:-150px; width:1400px; height:1100px; background:radial-gradient(circle at 30% 35%, rgba(124,58,237,0.18), rgba(124,58,237,0) 60%); opacity:0;"></div>
        <div class="fog2" style="position:absolute; left:700px; top:200px; width:1300px; height:1100px; background:radial-gradient(circle at 65% 60%, rgba(80,60,120,0.16), rgba(80,60,120,0) 62%); opacity:0;"></div>
        <div class="fog3" style="position:absolute; left:200px; top:400px; width:1600px; height:900px; background:radial-gradient(ellipse at 50% 70%, rgba(200,200,212,0.06), rgba(200,200,212,0) 65%); opacity:0;"></div>
        <div class="line" style="position:absolute; left:130px; top:440px; width:1660px; text-align:center; color:#f5f0eb; font-weight:400; font-size:74px; font-style:italic; letter-spacing:0.05em; line-height:1.8; max-width:1660px; word-wrap:break-word; overflow-wrap:break-word; text-shadow:0 0 30px rgba(124,58,237,0.55), 0 2px 14px rgba(0,0,0,0.6); opacity:0; filter:blur(14px);">…the hearts of the good ones</div>
      </div>
    </div>
  </div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
(function () {
  var vars = window.__hyperframes && window.__hyperframes.getVariables
    ? window.__hyperframes.getVariables() : {};
  var tl = gsap.timeline();
  var root = document.getElementById('content');

  /* ── Claude's content timeline (scoped to #content) ── */
  (function (tl, root, vars) {
      gsap.set(root.querySelector('.line'), { y: 26, scale: 0.97 });
      
      tl.to(root.querySelector('.fog1'), { opacity: 1, duration: 2.2, ease: "cubic-bezier(0,0,0.58,1)" }, 0.0)
        .to(root.querySelector('.fog2'), { opacity: 1, duration: 2.4, ease: "cubic-bezier(0,0,0.58,1)" }, 0.3)
        .to(root.querySelector('.fog3'), { opacity: 1, duration: 2.6, ease: "cubic-bezier(0,0,0.58,1)" }, 0.5)
        .to(root.querySelector('.line'), { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 1.6, ease: "cubic-bezier(0,0,0.58,1)" }, 0.4)
        .to(root.querySelector('.fog1'), { rotation: 4, duration: 5.0, ease: "none" }, 0.4)
        .to(root.querySelector('.fog2'), { rotation: -3, duration: 5.0, ease: "none" }, 0.4)
        .to(root.querySelector('.line'), { opacity: 0, y: -22, filter: "blur(10px)", duration: 0.8, ease: "cubic-bezier(0.4,0,1,1)" }, 6.7)
        .to([root.querySelector('.fog1'), root.querySelector('.fog2'), root.querySelector('.fog3')], { opacity: 0, duration: 0.8, ease: "cubic-bezier(0.4,0,1,1)" }, 6.8);
  })(tl, root, vars);

  /* ── Caption timeline (Python-owned) ── */
  (function (tl) {

  })(tl);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
