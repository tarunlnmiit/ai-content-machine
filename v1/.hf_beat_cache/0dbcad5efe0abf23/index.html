<!DOCTYPE html>
<html data-composition-fps="30" data-composition-duration="270" data-composition-variables='{"caption_text": {"type": "string", "default": "so you can see that you can see we have the scores array then for python loop we double it for"}, "niche_color": {"type": "string", "default": "#3b82f6"}}'>
<head>
<meta charset="utf-8">
<style>
  /* === Python-owned base === */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    background: transparent;
    overflow: hidden;
  }
  #main {
    position: relative;
    width: 1920px; height: 1080px;
    overflow: hidden;
  }
  
    /* === Python-owned panel geometry === */
    #panel {
      position: absolute;
      left: 980px; top: 60px;
      width: 900px; height: 960px;
      overflow: hidden;
      border-radius: 20px;
      background: rgba(17,24,39,0.88);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 8px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    /* Specular highlight at panel top edge */
    #panel::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.14), transparent);
      z-index: 100;
    }
    /* Claude's content is scoped here. (0,0) = panel top-left. */
    #content {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
  
  
    /* === Python-owned caption (sibling of #panel, never clipped) === */
    #caption-layer {
      position: absolute;
      left: 0px; width: 1920px;
      bottom: 80px;
      display: flex; justify-content: center; align-items: flex-end;
      pointer-events: none;
    }
  /* Caption pill */
  #caption-pill {
    max-width: 840px;
    padding: 12px 24px;
    border-radius: 10px;
    background: rgba(10,14,26,0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #f0f4ff;
    font: 600 30px/1.4 'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  #caption-pill .w {
    display: inline-block;
    margin: 0 3px;
    opacity: 0;
  }
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-duration="9.000" data-width="1920" data-height="1080">
  
  <div id="panel">
    <div id="content">
      <div style="position:absolute; top:0; left:0; width:900px; height:960px; background:#0a0e1a; overflow:hidden;">
        <div class="glow-orb" style="position:absolute; top:280px; left:250px; width:400px; height:400px; border-radius:50%; background:radial-gradient(circle, rgba(59,130,246,0.18), transparent 70%); filter:blur(40px);"></div>
        <div class="line line1" style="position:absolute; top:360px; left:60px; width:780px; max-width:840px; font-family:'JetBrains Mono','Fira Code',monospace; font-size:74px; font-weight:400; letter-spacing:0; line-height:1.2; color:#06b6d4; text-shadow:0 0 30px rgba(6,182,212,0.6); word-wrap:break-word; overflow-wrap:break-word;">scores * 2</div>
        <div class="line line2" style="position:absolute; top:470px; left:60px; width:780px; max-width:840px; font-family:'Inter','SF Pro Display',sans-serif; font-size:60px; font-weight:800; letter-spacing:-0.02em; line-height:1.2; background:linear-gradient(135deg,#3b82f6,#8b5cf6,#06b6d4); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; text-shadow:0 0 30px rgba(59,130,246,0.4); word-wrap:break-word; overflow-wrap:break-word;">every element doubled<br><span style="font-size:42px; font-weight:500; -webkit-text-fill-color:#64748b; color:#64748b;">(no loop)</span></div>
      </div>
    </div>
  </div>
  <div id="caption-layer"><div id="caption-pill"><span class="w">so</span><span class="w">you</span><span class="w">can</span><span class="w">see</span><span class="w">that</span><span class="w">you</span><span class="w">can</span><span class="w">see</span><span class="w">we</span><span class="w">have</span><span class="w">the</span><span class="w">scores</span><span class="w">array</span><span class="w">then</span><span class="w">for</span><span class="w">python</span><span class="w">loop</span><span class="w">we</span><span class="w">double</span><span class="w">it</span><span class="w">for</span></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
(function () {
  var vars = window.__hyperframes && window.__hyperframes.getVariables
    ? window.__hyperframes.getVariables() : {};
  var tl = gsap.timeline();
  var root = document.getElementById('content');

  /* ── Claude's content timeline (scoped to #content) ── */
  (function (tl, root, vars) {
      gsap.set(root.querySelector('.glow-orb'), { scale: 0.7, opacity: 0 });
      gsap.set(root.querySelector('.line1'), { opacity: 0, y: 20, scale: 0.92 });
      gsap.set(root.querySelector('.line2'), { opacity: 0, y: 20, scale: 0.92 });
      
      tl.to(root.querySelector('.glow-orb'), { opacity: 1, scale: 1, duration: 1.0, ease: 'cubic-bezier(0.34,1.56,0.64,1)' }, 0);
      
      tl.to(root.querySelector('.line1'), { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'cubic-bezier(0.34,1.56,0.64,1)' }, 0.1);
      
      tl.to(root.querySelector('.line1'), { opacity: 0.3, scale: 0.96, duration: 0.4, ease: 'cubic-bezier(0.4,0,1,1)' }, 1.8);
      tl.to(root.querySelector('.line2'), { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'cubic-bezier(0.34,1.56,0.64,1)' }, 1.8);
      
      tl.to(root.querySelector('.glow-orb'), { scale: 1.15, duration: 4.0, ease: 'cubic-bezier(0,0,1,1)' }, 2.0);
      
      tl.to([root.querySelector('.line1'), root.querySelector('.line2'), root.querySelector('.glow-orb')], { opacity: 0, duration: 0.25, ease: 'cubic-bezier(0.4,0,1,1)' }, 8.6);
  })(tl, root, vars);

  /* ── Caption timeline (Python-owned) ── */
  (function (tl) {
          var cw = document.querySelectorAll('#caption-pill .w');
          gsap.set(cw, { opacity: 0, y: 8 });
          tl.to(cw, { opacity: 1, y: 0, duration: 0.25, stagger: 0.1, ease: 'power2.out' }, 0.2);
  })(tl);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
