<!DOCTYPE html>
<html data-composition-fps="30" data-composition-duration="180" data-composition-variables='{"caption_text": {"type": "string", "default": "articles recording videos building projects and showing up to client meetings exactly as expected"}, "niche_color": {"type": "string", "default": "#3b82f6"}}'>
<head>
<meta charset="utf-8">
<style>
  /* === Python-owned base === */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    background: transparent;
    overflow: hidden;
  }
  #main {
    position: relative;
    width: 1920px; height: 1080px;
    overflow: hidden;
  }
  
    /* === Python-owned panel geometry === */
    #panel {
      position: absolute;
      left: 980px; top: 60px;
      width: 900px; height: 960px;
      overflow: hidden;
      border-radius: 20px;
      background: rgba(17,24,39,0.88);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 8px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    /* Specular highlight at panel top edge */
    #panel::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.14), transparent);
      z-index: 100;
    }
    /* Claude's content is scoped here. (0,0) = panel top-left. */
    #content {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
  
  
    /* === Python-owned caption (sibling of #panel, never clipped) === */
    #caption-layer {
      position: absolute;
      left: 0px; width: 1920px;
      bottom: 80px;
      display: flex; justify-content: center; align-items: flex-end;
      pointer-events: none;
    }
  /* Caption pill */
  #caption-pill {
    max-width: 840px;
    padding: 12px 24px;
    border-radius: 10px;
    background: rgba(10,14,26,0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #f0f4ff;
    font: 600 30px/1.4 'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  #caption-pill .w {
    display: inline-block;
    margin: 0 3px;
    opacity: 0;
  }
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-duration="6.000" data-width="1920" data-height="1080">
  
  <div id="panel">
    <div id="content">
      <div style="position:absolute;top:0;left:0;width:900px;height:960px;background:#1a1208;overflow:hidden;">
        <div style="position:absolute;top:0;left:0;width:900px;height:960px;background:radial-gradient(circle at 50% 38%, rgba(245,158,11,0.10), transparent 60%);"></div>
        <div class="kicker" style="position:absolute;top:150px;left:90px;width:720px;font-family:'Inter','SF Pro Text',sans-serif;font-weight:500;font-size:30px;letter-spacing:0.18em;text-transform:uppercase;color:#a0856a;">Zeigarnik effect</div>
        <div class="line1" style="position:absolute;top:330px;left:90px;width:720px;font-family:'Cormorant Garamond','Georgia',serif;font-weight:600;font-size:74px;line-height:1.3;letter-spacing:-0.01em;color:#fdf8f0;word-wrap:break-word;overflow-wrap:break-word;">The mind holds onto <span style="color:#f59e0b;">incomplete</span> things</div>
        <div class="line2" style="position:absolute;top:560px;left:90px;width:720px;font-family:'Cormorant Garamond','Georgia',serif;font-weight:600;font-size:74px;line-height:1.3;letter-spacing:-0.01em;color:#fdf8f0;word-wrap:break-word;overflow-wrap:break-word;">draining <span style="color:#ef4444;">bandwidth</span> in the background</div>
        <div class="rule" style="position:absolute;top:300px;left:90px;width:120px;height:3px;background:linear-gradient(90deg,#f59e0b,transparent);"></div>
      </div>
    </div>
  </div>
  <div id="caption-layer"><div id="caption-pill"><span class="w">articles</span><span class="w">recording</span><span class="w">videos</span><span class="w">building</span><span class="w">projects</span><span class="w">and</span><span class="w">showing</span><span class="w">up</span><span class="w">to</span><span class="w">client</span><span class="w">meetings</span><span class="w">exactly</span><span class="w">as</span><span class="w">expected</span></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
(function () {
  var vars = window.__hyperframes && window.__hyperframes.getVariables
    ? window.__hyperframes.getVariables() : {};
  var tl = gsap.timeline();
  var root = document.getElementById('content');

  /* ── Claude's content timeline (scoped to #content) ── */
  (function (tl, root, vars) {
      gsap.set(root.querySelector('.kicker'), {opacity:0, y:16});
      gsap.set(root.querySelector('.rule'), {scaleX:0, transformOrigin:'left center'});
      gsap.set(root.querySelector('.line1'), {opacity:0, y:20, filter:'blur(8px)'});
      gsap.set(root.querySelector('.line2'), {opacity:0, y:20, filter:'blur(8px)'});
      
      tl.to(root.querySelector('.kicker'), {opacity:1, y:0, duration:0.5, ease:'cubic-bezier(0.34,1.56,0.64,1)'}, 0.0);
      tl.to(root.querySelector('.rule'), {scaleX:1, duration:0.6, ease:'cubic-bezier(0.16,1,0.3,1)'}, 0.1);
      tl.to(root.querySelector('.line1'), {opacity:1, y:0, filter:'blur(0px)', duration:0.7, ease:'cubic-bezier(0.34,1.56,0.64,1)'}, 0.1);
      
      tl.to(root.querySelector('.line1'), {opacity:0.28, filter:'blur(2px)', duration:0.6, ease:'cubic-bezier(0.4,0,1,1)'}, 1.8);
      tl.to(root.querySelector('.line2'), {opacity:1, y:0, filter:'blur(0px)', duration:0.7, ease:'cubic-bezier(0.34,1.56,0.64,1)'}, 1.9);
  })(tl, root, vars);

  /* ── Caption timeline (Python-owned) ── */
  (function (tl) {
          var cw = document.querySelectorAll('#caption-pill .w');
          gsap.set(cw, { opacity: 0, y: 8 });
          tl.to(cw, { opacity: 1, y: 0, duration: 0.25, stagger: 0.1, ease: 'power2.out' }, 0.2);
  })(tl);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
