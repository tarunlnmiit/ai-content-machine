<!DOCTYPE html>
<html data-composition-fps="30" data-composition-duration="180" data-composition-variables='{"caption_text": {"type": "string", "default": "there's a version of you that most people will never meet the one who replays a conversation from 3 years ago"}, "niche_color": {"type": "string", "default": "#3b82f6"}}'>
<head>
<meta charset="utf-8">
<style>
  /* === Python-owned base === */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    background: transparent;
    overflow: hidden;
  }
  #main {
    position: relative;
    width: 1920px; height: 1080px;
    overflow: hidden;
  }
  
    /* === Fullscreen layout === */
    #panel {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #content {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
  
  
    /* === Python-owned caption (fullscreen) === */
    #caption-layer {
      position: absolute;
      left: 0; right: 0;
      bottom: 80px;
      display: flex; justify-content: center; align-items: flex-end;
      pointer-events: none;
    }
  /* Caption pill */
  #caption-pill {
    max-width: 1860px;
    padding: 12px 24px;
    border-radius: 10px;
    background: rgba(10,14,26,0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #f0f4ff;
    font: 600 30px/1.4 'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  #caption-pill .w {
    display: inline-block;
    margin: 0 3px;
    opacity: 0;
  }
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-duration="6.000" data-width="1920" data-height="1080">
  
  <div id="panel">
    <div id="content">
      <div style="position:absolute; top:0; left:0; width:1920px; height:1080px; background:rgba(10,8,5,0.55); overflow:hidden; font-family:'Playfair Display','Georgia',serif;">
        <div style="position:absolute; top:0; left:0; width:1920px; height:1080px; background:radial-gradient(circle at 25% 30%, rgba(245,158,11,0.18), transparent 45%), radial-gradient(circle at 78% 70%, rgba(239,68,68,0.12), transparent 50%), radial-gradient(circle at 50% 50%, rgba(134,239,172,0.06), transparent 60%);"></div>
        <div style="position:absolute; top:0; left:0; width:1920px; height:1080px; background:radial-gradient(ellipse at center, transparent 35%, rgba(10,8,5,0.55) 100%);"></div>
        <div class="label" style="position:absolute; top:300px; left:160px; width:1600px; text-align:center; font-family:'Inter','Helvetica Neue',sans-serif; font-weight:500; font-size:30px; letter-spacing:0.28em; text-transform:uppercase; color:#a0856a; text-shadow:0 2px 12px rgba(0,0,0,0.7);">when they ask how you are</div>
        <div class="w1" style="position:absolute; top:430px; left:160px; width:1600px; text-align:center; font-weight:900; font-size:200px; line-height:1.05; letter-spacing:-0.02em; color:#a0856a; text-shadow:0 8px 50px rgba(0,0,0,0.6);">“fine”</div>
        <div class="w2" style="position:absolute; top:430px; left:160px; width:1600px; text-align:center; font-weight:900; font-size:180px; line-height:1.05; letter-spacing:-0.02em; color:#f59e0b; text-shadow:0 0 60px rgba(245,158,11,0.5), 0 8px 40px rgba(0,0,0,0.6);">carrying</div>
        <div class="w3" style="position:absolute; top:430px; left:160px; width:1600px; text-align:center; font-weight:900; font-size:200px; line-height:1.05; letter-spacing:-0.02em; color:#86efac; text-shadow:0 0 70px rgba(134,239,172,0.55), 0 8px 40px rgba(0,0,0,0.6);">seen</div>
        <div class="rule" style="position:absolute; top:760px; left:810px; width:300px; height:4px; background:linear-gradient(90deg, transparent, #f59e0b, transparent); border-radius:2px;"></div>
      </div>
    </div>
  </div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
(function () {
  var vars = window.__hyperframes && window.__hyperframes.getVariables
    ? window.__hyperframes.getVariables() : {};
  var tl = gsap.timeline();
  var root = document.getElementById('content');

  /* ── Claude's content timeline (scoped to #content) ── */
  (function (tl, root, vars) {
      gsap.set(root.querySelector('.label'), { opacity: 0, y: 20 });
      gsap.set(root.querySelector('.w1'), { opacity: 0, scale: 0.92, y: 24, filter: 'blur(8px)' });
      gsap.set(root.querySelector('.w2'), { opacity: 0, scale: 0.92, y: 24, filter: 'blur(8px)' });
      gsap.set(root.querySelector('.w3'), { opacity: 0, scale: 0.92, y: 24, filter: 'blur(8px)' });
      gsap.set(root.querySelector('.rule'), { opacity: 0, scaleX: 0, transformOrigin: 'center' });
      
      tl.to(root.querySelector('.label'), { opacity: 1, y: 0, duration: 0.6, ease: 'cubic-bezier(0.25,0.46,0.45,0.94)' }, 0.0);
      
      // word 1: "fine"
      tl.to(root.querySelector('.w1'), { opacity: 1, scale: 1, y: 0, filter: 'blur(0px)', duration: 0.6, ease: 'cubic-bezier(0.34,1.56,0.64,1)' }, 0.4);
      tl.to(root.querySelector('.w1'), { opacity: 0, scale: 0.96, y: -20, filter: 'blur(6px)', duration: 0.4, ease: 'cubic-bezier(0.4,0,1,1)' }, 1.9);
      
      // word 2: "carrying"
      tl.to(root.querySelector('.w2'), { opacity: 1, scale: 1, y: 0, filter: 'blur(0px)', duration: 0.6, ease: 'cubic-bezier(0.34,1.56,0.64,1)' }, 2.2);
      tl.to(root.querySelector('.w2'), { opacity: 0, scale: 0.96, y: -20, filter: 'blur(6px)', duration: 0.4, ease: 'cubic-bezier(0.4,0,1,1)' }, 3.7);
      
      // word 3: "seen"
      tl.to(root.querySelector('.w3'), { opacity: 1, scale: 1, y: 0, filter: 'blur(0px)', duration: 0.7, ease: 'cubic-bezier(0.34,1.56,0.64,1)' }, 4.0);
      tl.to(root.querySelector('.rule'), { opacity: 1, scaleX: 1, duration: 0.8, ease: 'cubic-bezier(0.16,1,0.3,1)' }, 4.3);
  })(tl, root, vars);

  /* ── Caption timeline (Python-owned) ── */
  (function (tl) {

  })(tl);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
