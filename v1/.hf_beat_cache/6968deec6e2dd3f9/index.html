<!DOCTYPE html>
<html data-composition-fps="30" data-composition-duration="516" data-composition-variables='{"caption_text": {"type": "string", "default": "listen for that last line doubling waking up to a realization about how the world is changing people drooling over aesthetics all over the hearts of the good ones wearing layers of masks themselves"}, "niche_color": {"type": "string", "default": "#3b82f6"}}'>
<head>
<meta charset="utf-8">
<style>
  /* === Python-owned base === */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    background: transparent;
    overflow: hidden;
  }
  #main {
    position: relative;
    width: 1920px; height: 1080px;
    overflow: hidden;
  }
  
    /* === Fullscreen layout === */
    #panel {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #content {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
  
  
    /* === Python-owned caption (fullscreen) === */
    #caption-layer {
      position: absolute;
      left: 0; right: 0;
      bottom: 80px;
      display: flex; justify-content: center; align-items: flex-end;
      pointer-events: none;
    }
  /* Caption pill */
  #caption-pill {
    max-width: 1860px;
    padding: 12px 24px;
    border-radius: 10px;
    background: rgba(10,14,26,0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #f0f4ff;
    font: 600 30px/1.4 'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  #caption-pill .w {
    display: inline-block;
    margin: 0 3px;
    opacity: 0;
  }
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-duration="17.200" data-width="1920" data-height="1080">
  
  <div id="panel">
    <div id="content">
      <div style="position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(ellipse 1400px 900px at 50% 38%, #15121c 0%, #0f0f12 45%, #080808 100%);">
        <div style="position:absolute;left:0;top:0;width:1920px;height:1080px;background:radial-gradient(circle 700px at 22% 78%, rgba(124,58,237,0.10), transparent 60%);"></div>
        <div style="position:absolute;left:0;top:0;width:1920px;height:1080px;background:radial-gradient(circle 620px at 80% 22%, rgba(80,60,120,0.12), transparent 62%);"></div>
        <div class="fog" style="position:absolute;left:0;top:0;width:1920px;height:1080px;background:rgba(80,60,120,0.06);mix-blend-mode:screen;"></div>
        <div class="vig" style="position:absolute;left:0;top:0;width:1920px;height:1080px;box-shadow:inset 0 0 360px 120px rgba(0,0,0,0.85);"></div>
      
        <div class="line1" style="position:absolute;left:130px;top:470px;width:1660px;text-align:center;font-family:'Cormorant Garamond','Garamond','Georgia',serif;font-weight:400;font-size:72px;line-height:1.8;letter-spacing:0.05em;color:#f5f0eb;text-shadow:0 0 38px rgba(124,58,237,0.28);">
          and still the quiet keeps what we let go
        </div>
        <div class="line2" style="position:absolute;left:130px;top:470px;width:1660px;text-align:center;font-family:'Cormorant Garamond','Garamond','Georgia',serif;font-weight:600;font-style:italic;font-size:76px;line-height:1.8;letter-spacing:0.05em;color:#f5f0eb;text-shadow:0 0 44px rgba(124,58,237,0.40);">
          every ending was a door we mistook for a wall
        </div>
      </div>
    </div>
  </div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
(function () {
  var vars = window.__hyperframes && window.__hyperframes.getVariables
    ? window.__hyperframes.getVariables() : {};
  var tl = gsap.timeline();
  var root = document.getElementById('content');

  /* ── Claude's content timeline (scoped to #content) ── */
  (function (tl, root, vars) {
      const l1 = root.querySelector('.line1');
      const l2 = root.querySelector('.line2');
      const fog = root.querySelector('.fog');
      
      gsap.set([l1, l2], { opacity: 0, y: 22, filter: 'blur(10px)' });
      gsap.set(l2, { scale: 0.985 });
      
      // Line 1 breathes in
      tl.to(l1, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 1.0, ease: 'cubic-bezier(0.0,0.0,0.58,1.0)' }, 0.1);
      
      // Hold, then dim line 1 as line 2 enters (weight-shift)
      tl.to(l1, { opacity: 0.18, y: -14, filter: 'blur(3px)', duration: 0.9, ease: 'cubic-bezier(0.42,0,1.0,1.0)' }, 7.6);
      tl.to(l2, { opacity: 1, y: 0, scale: 1, filter: 'blur(0px)', duration: 1.0, ease: 'cubic-bezier(0.34,1.56,0.64,1)' }, 7.9);
      
      // Slow atmospheric fog drift through the whole beat
      tl.to(fog, { x: 36, opacity: 0.10, duration: 17.0, ease: 'cubic-bezier(0,0,1,1)' }, 0);
      
      // Final settle / gentle exit before end
      tl.to(l2, { filter: 'blur(0px)', textShadow: '0 0 56px rgba(124,58,237,0.5)', duration: 2.0, ease: 'cubic-bezier(0.16,1,0.3,1)' }, 14.6);
      tl.to([l1, l2], { opacity: (i) => i === 0 ? 0 : 0.85, duration: 0.8, ease: 'cubic-bezier(0.42,0,1.0,1.0)' }, 16.2);
  })(tl, root, vars);

  /* ── Caption timeline (Python-owned) ── */
  (function (tl) {

  })(tl);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
