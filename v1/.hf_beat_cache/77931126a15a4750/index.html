<!DOCTYPE html>
<html data-composition-fps="30" data-composition-duration="165" data-composition-variables='{"caption_text": {"type": "string", "default": "the line that hits hardest shitting all over the hearts of the good ones"}, "niche_color": {"type": "string", "default": "#3b82f6"}}'>
<head>
<meta charset="utf-8">
<style>
  /* === Python-owned base === */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    background: transparent;
    overflow: hidden;
  }
  #main {
    position: relative;
    width: 1920px; height: 1080px;
    overflow: hidden;
  }
  
    /* === Fullscreen layout === */
    #panel {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #content {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
  
  
    /* === Python-owned caption (fullscreen) === */
    #caption-layer {
      position: absolute;
      left: 0; right: 0;
      bottom: 80px;
      display: flex; justify-content: center; align-items: flex-end;
      pointer-events: none;
    }
  /* Caption pill */
  #caption-pill {
    max-width: 1860px;
    padding: 12px 24px;
    border-radius: 10px;
    background: rgba(10,14,26,0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #f0f4ff;
    font: 600 30px/1.4 'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  #caption-pill .w {
    display: inline-block;
    margin: 0 3px;
    opacity: 0;
  }
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-duration="5.500" data-width="1920" data-height="1080">
  
  <div id="panel">
    <div id="content">
      <div class="slam-root" style="position:absolute; top:0; left:0; width:1920px; height:1080px; overflow:hidden; background:
        radial-gradient(900px 600px at 30% 35%, rgba(124,58,237,0.12), transparent 70%),
        radial-gradient(800px 700px at 72% 68%, rgba(80,60,120,0.10), transparent 72%),
        radial-gradient(1400px 1000px at 50% 50%, rgba(15,15,18,0.30), transparent 80%),
        rgba(10,8,5,0.55);">
      
        <div class="vignette" style="position:absolute; top:0; left:0; width:1920px; height:1080px;
          background:radial-gradient(1200px 900px at 50% 50%, transparent 45%, rgba(0,0,0,0.55) 100%); opacity:0.9;"></div>
      
        <div class="halo" style="position:absolute; top:300px; left:560px; width:800px; height:480px;
          background:radial-gradient(closed-side, rgba(124,58,237,0.22), transparent 65%);
          background:radial-gradient(circle, rgba(124,58,237,0.22), transparent 65%); filter:blur(40px); opacity:0;"></div>
      
        <div class="slam-word" style="position:absolute; top:0; left:0; width:1920px; height:1080px;
          display:flex; align-items:center; justify-content:center;
          font-family:'Cormorant Garamond','Garamond','Georgia','Times New Roman',serif;
          font-weight:700; font-size:220px; letter-spacing:-0.01em; line-height:1.0;
          color:#f5f0eb;
          text-shadow:0 0 40px rgba(124,58,237,0.55), 0 0 18px rgba(245,240,235,0.35), 0 6px 30px rgba(0,0,0,0.6);">GOOD</div>
      
      </div>
    </div>
  </div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
(function () {
  var vars = window.__hyperframes && window.__hyperframes.getVariables
    ? window.__hyperframes.getVariables() : {};
  var tl = gsap.timeline();
  var root = document.getElementById('content');

  /* ── Claude's content timeline (scoped to #content) ── */
  (function (tl, root, vars) {
      const word = root.querySelector('.slam-word');
      const halo = root.querySelector('.halo');
      const vignette = root.querySelector('.vignette');
      
      gsap.set(word, { scale: 3.0, opacity: 0, filter: 'blur(24px)' });
      gsap.set(halo, { opacity: 0, scale: 1.2 });
      gsap.set(vignette, { opacity: 0.9 });
      
      // SLAM in — scale 3→1 with motion-blur settle
      tl.to(word, { opacity: 1, duration: 0.18, ease: 'cubic-bezier(0,0,1,1)' }, 0.0);
      tl.to(word, { scale: 1.0, filter: 'blur(0px)', duration: 0.42, ease: 'cubic-bezier(0.34,1.56,0.64,1)' }, 0.0);
      
      // halo bloom on impact
      tl.to(halo, { opacity: 1, scale: 1.0, duration: 0.5, ease: 'cubic-bezier(0.16,1,0.3,1)' }, 0.30);
      
      // micro recoil after slam
      tl.to(word, { scale: 1.03, duration: 0.18, ease: 'cubic-bezier(0.16,1,0.3,1)' }, 0.42);
      tl.to(word, { scale: 1.0, duration: 0.4, ease: 'cubic-bezier(0.16,1,0.3,1)' }, 0.60);
      
      // long hold — let it breathe
      tl.to(halo, { opacity: 0.7, duration: 2.0, ease: 'cubic-bezier(0,0,1,1)' }, 1.2);
      
      // exit
      tl.to(word, { opacity: 0, scale: 1.12, filter: 'blur(10px)', duration: 0.6, ease: 'cubic-bezier(0.4,0,1,1)' }, 4.8);
      tl.to(halo, { opacity: 0, duration: 0.6, ease: 'cubic-bezier(0.4,0,1,1)' }, 4.8);
  })(tl, root, vars);

  /* ── Caption timeline (Python-owned) ── */
  (function (tl) {

  })(tl);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
