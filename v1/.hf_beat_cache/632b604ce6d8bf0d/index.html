<!DOCTYPE html>
<html data-composition-fps="30" data-composition-duration="180" data-composition-variables='{"caption_text": {"type": "string", "default": "there is a concept in psychology called cognitive load the total mental resources"}, "niche_color": {"type": "string", "default": "#3b82f6"}}'>
<head>
<meta charset="utf-8">
<style>
  /* === Python-owned base === */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    background: transparent;
    overflow: hidden;
  }
  #main {
    position: relative;
    width: 1920px; height: 1080px;
    overflow: hidden;
  }
  
    /* === Python-owned panel geometry === */
    #panel {
      position: absolute;
      left: 60px; top: 40px;
      width: 1800px; height: 480px;
      overflow: hidden;
      border-radius: 0 0 20px 20px;
      background: rgba(17,24,39,0.88);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 8px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    /* Specular highlight at panel top edge */
    #panel::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.14), transparent);
      z-index: 100;
    }
    /* Claude's content is scoped here. (0,0) = panel top-left. */
    #content {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
  
  
    /* === Python-owned caption (sibling of #panel, never clipped) === */
    #caption-layer {
      position: absolute;
      left: 0px; width: 1920px;
      bottom: 80px;
      display: flex; justify-content: center; align-items: flex-end;
      pointer-events: none;
    }
  /* Caption pill */
  #caption-pill {
    max-width: 1740px;
    padding: 12px 24px;
    border-radius: 10px;
    background: rgba(10,14,26,0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #f0f4ff;
    font: 600 30px/1.4 'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  #caption-pill .w {
    display: inline-block;
    margin: 0 3px;
    opacity: 0;
  }
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-duration="6.000" data-width="1920" data-height="1080">
  
  <div id="panel">
    <div id="content">
      <div style="position:absolute; left:0; top:0; width:1800px; height:480px; background:#1a1208; overflow:hidden;">
        <div class="brut" style="position:absolute; left:80px; top:70px; width:1640px; height:340px; background:#231a0e; border:3px solid #f59e0b; box-shadow:6px 6px 0 #ef4444; display:flex; flex-direction:column; justify-content:center; padding:0 64px; box-sizing:border-box;">
          <div class="label" style="position:absolute; left:64px; top:28px; font-family:'Inter',sans-serif; font-weight:500; font-size:22px; letter-spacing:0.28em; color:#a0856a;">THE WEIGHT WE DON'T SEE</div>
          <div class="line1" style="font-family:'Cormorant Garamond','Georgia',serif; font-weight:700; font-size:78px; line-height:1.05; letter-spacing:-0.01em; color:#fdf8f0; max-width:1500px; word-wrap:break-word; overflow-wrap:break-word;">CARRYING INVISIBLE THINGS</div>
          <div class="line2" style="font-family:'Cormorant Garamond','Georgia',serif; font-weight:900; font-size:80px; line-height:1.05; letter-spacing:-0.01em; color:#f59e0b; margin-top:8px; max-width:1500px; word-wrap:break-word; overflow-wrap:break-word; text-shadow:0 0 30px rgba(245,158,11,0.45);">IS NORMALIZED</div>
        </div>
      </div>
    </div>
  </div>
  <div id="caption-layer"><div id="caption-pill"><span class="w">there</span><span class="w">is</span><span class="w">a</span><span class="w">concept</span><span class="w">in</span><span class="w">psychology</span><span class="w">called</span><span class="w">cognitive</span><span class="w">load</span><span class="w">the</span><span class="w">total</span><span class="w">mental</span><span class="w">resources</span></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
(function () {
  var vars = window.__hyperframes && window.__hyperframes.getVariables
    ? window.__hyperframes.getVariables() : {};
  var tl = gsap.timeline();
  var root = document.getElementById('content');

  /* ── Claude's content timeline (scoped to #content) ── */
  (function (tl, root, vars) {
      const brut = root.querySelector('.brut');
      const label = root.querySelector('.label');
      const line1 = root.querySelector('.line1');
      const line2 = root.querySelector('.line2');
      
      gsap.set(brut, { opacity: 0, scale: 0.92, x: -20, transformOrigin: 'left center' });
      gsap.set(label, { opacity: 0, y: -12 });
      gsap.set(line1, { opacity: 0, y: 24 });
      gsap.set(line2, { opacity: 0, y: 24 });
      
      tl.to(brut, { opacity: 1, scale: 1, x: 0, duration: 0.5, ease: 'cubic-bezier(0.34,1.56,0.64,1)' }, 0.0);
      tl.to(label, { opacity: 1, y: 0, duration: 0.5, ease: 'cubic-bezier(0.25,0.46,0.45,0.94)' }, 0.15);
      tl.to(line1, { opacity: 1, y: 0, duration: 0.6, ease: 'cubic-bezier(0.34,1.56,0.64,1)' }, 0.1);
      
      tl.to(line1, { opacity: 0.32, color: '#a0856a', duration: 0.5, ease: 'cubic-bezier(0.25,0.46,0.45,0.94)' }, 1.8);
      tl.to(line2, { opacity: 1, y: 0, duration: 0.6, ease: 'cubic-bezier(0.34,1.56,0.64,1)' }, 1.8);
      
      tl.to(brut, { boxShadow: '10px 10px 0 #ef4444', duration: 0.4, ease: 'cubic-bezier(0.34,1.56,0.64,1)' }, 1.8);
      tl.to(line2, { scale: 1.015, transformOrigin: 'left center', duration: 1.2, ease: 'cubic-bezier(0.0,0.0,0.2,1)' }, 2.4);
  })(tl, root, vars);

  /* ── Caption timeline (Python-owned) ── */
  (function (tl) {
          var cw = document.querySelectorAll('#caption-pill .w');
          gsap.set(cw, { opacity: 0, y: 8 });
          tl.to(cw, { opacity: 1, y: 0, duration: 0.25, stagger: 0.1, ease: 'power2.out' }, 0.2);
  })(tl);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
