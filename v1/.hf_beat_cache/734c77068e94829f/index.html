<!DOCTYPE html>
<html data-composition-fps="30" data-composition-duration="180" data-composition-variables='{"caption_text": {"type": "string", "default": "because the zeigarnik loop doesn't need resolution it needs attention"}, "niche_color": {"type": "string", "default": "#3b82f6"}}'>
<head>
<meta charset="utf-8">
<style>
  /* === Python-owned base === */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    background: transparent;
    overflow: hidden;
  }
  #main {
    position: relative;
    width: 1920px; height: 1080px;
    overflow: hidden;
  }
  
    /* === Fullscreen layout === */
    #panel {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #content {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
  
  
    /* === Python-owned caption (fullscreen) === */
    #caption-layer {
      position: absolute;
      left: 0; right: 0;
      bottom: 80px;
      display: flex; justify-content: center; align-items: flex-end;
      pointer-events: none;
    }
  /* Caption pill */
  #caption-pill {
    max-width: 1860px;
    padding: 12px 24px;
    border-radius: 10px;
    background: rgba(10,14,26,0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #f0f4ff;
    font: 600 30px/1.4 'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  #caption-pill .w {
    display: inline-block;
    margin: 0 3px;
    opacity: 0;
  }
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-duration="6.000" data-width="1920" data-height="1080">
  
  <div id="panel">
    <div id="content">
      <div style="position:absolute;left:0;top:0;width:1920px;height:1080px;background:rgba(10,8,5,0.55);overflow:hidden;font-family:'Playfair Display','Georgia',serif;">
        <div class="bg" style="position:absolute;left:0;top:0;width:1920px;height:1080px;background:radial-gradient(circle at 30% 35%, rgba(245,158,11,0.18), transparent 45%), radial-gradient(circle at 72% 68%, rgba(239,68,68,0.16), transparent 50%), radial-gradient(circle at 50% 90%, rgba(134,239,172,0.05), transparent 55%);"></div>
        <div class="ring" style="position:absolute;left:560px;top:240px;width:800px;height:600px;border:2px solid rgba(245,158,11,0.18);border-radius:32px;"></div>
        <div class="streak" style="position:absolute;left:0px;top:520px;width:1920px;height:6px;background:linear-gradient(90deg, transparent, rgba(239,68,68,0.55), transparent);"></div>
        <div class="word" style="position:absolute;left:0px;top:380px;width:1920px;text-align:center;font-weight:900;font-size:200px;letter-spacing:-0.01em;line-height:1.3;color:#ef4444;text-shadow:0 0 40px rgba(239,68,68,0.7), 0 8px 30px rgba(0,0,0,0.6);max-width:1860px;word-wrap:break-word;overflow-wrap:break-word;">ATTENTION</div>
      </div>
    </div>
  </div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
(function () {
  var vars = window.__hyperframes && window.__hyperframes.getVariables
    ? window.__hyperframes.getVariables() : {};
  var tl = gsap.timeline();
  var root = document.getElementById('content');

  /* ── Claude's content timeline (scoped to #content) ── */
  (function (tl, root, vars) {
      gsap.set(root.querySelector('.bg'), { opacity: 0, scale: 1.1 });
      gsap.set(root.querySelector('.ring'), { opacity: 0, scale: 0.8 });
      gsap.set(root.querySelector('.streak'), { opacity: 0, scaleX: 0 });
      gsap.set(root.querySelector('.word'), { opacity: 0, scale: 3, filter: 'blur(24px)' });
      
      tl.to(root.querySelector('.bg'), { opacity: 1, scale: 1, duration: 0.8, ease: 'power2.out' }, 0);
      tl.to(root.querySelector('.word'), { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.3, ease: 'cubic-bezier(0.34,1.56,0.64,1)' }, 0.1);
      tl.to(root.querySelector('.streak'), { opacity: 1, scaleX: 1, duration: 0.4, ease: 'power3.out' }, 0.3);
      tl.to(root.querySelector('.ring'), { opacity: 1, scale: 1, duration: 0.6, ease: 'cubic-bezier(0.34,1.56,0.64,1)' }, 0.35);
      
      tl.to(root.querySelector('.word'), { scale: 1.04, duration: 1.6, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0.6);
      tl.to(root.querySelector('.ring'), { rotation: 2, duration: 3.0, ease: 'sine.inOut' }, 0.6);
      
      tl.to([root.querySelector('.word'), root.querySelector('.ring'), root.querySelector('.streak'), root.querySelector('.bg')], { opacity: 0, duration: 0.4, ease: 'cubic-bezier(0.4,0,1,1)' }, 5.5);
  })(tl, root, vars);

  /* ── Caption timeline (Python-owned) ── */
  (function (tl) {

  })(tl);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
