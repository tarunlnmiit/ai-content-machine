<!DOCTYPE html>
<html data-composition-fps="30" data-composition-duration="270" data-composition-variables='{"caption_text": {"type": "string", "default": "and global packages separate so let's install numpy so as you"}, "niche_color": {"type": "string", "default": "#3b82f6"}}'>
<head>
<meta charset="utf-8">
<style>
  /* === Python-owned base === */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    background: transparent;
    overflow: hidden;
  }
  #main {
    position: relative;
    width: 1920px; height: 1080px;
    overflow: hidden;
  }
  
    /* === Python-owned panel geometry === */
    #panel {
      position: absolute;
      left: 980px; top: 60px;
      width: 900px; height: 960px;
      overflow: hidden;
      border-radius: 20px;
      background: rgba(17,24,39,0.88);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 8px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    /* Specular highlight at panel top edge */
    #panel::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.14), transparent);
      z-index: 100;
    }
    /* Claude's content is scoped here. (0,0) = panel top-left. */
    #content {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
  
  
    /* === Python-owned caption (sibling of #panel, never clipped) === */
    #caption-layer {
      position: absolute;
      left: 0px; width: 1920px;
      bottom: 80px;
      display: flex; justify-content: center; align-items: flex-end;
      pointer-events: none;
    }
  /* Caption pill */
  #caption-pill {
    max-width: 840px;
    padding: 12px 24px;
    border-radius: 10px;
    background: rgba(10,14,26,0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #f0f4ff;
    font: 600 30px/1.4 'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  #caption-pill .w {
    display: inline-block;
    margin: 0 3px;
    opacity: 0;
  }
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-duration="9.000" data-width="1920" data-height="1080">
  
  <div id="panel">
    <div id="content">
      <div style="position:absolute;top:0;left:0;width:900px;height:960px;overflow:hidden;display:flex;align-items:center;justify-content:center;">
        <div class="terminal" style="position:absolute;top:380px;left:60px;width:780px;border:2px solid rgba(59,130,246,0.4);border-radius:12px;background:#111827;box-shadow:0 0 40px rgba(59,130,246,0.25);overflow:hidden;">
          <div class="bar" style="position:absolute;top:0;left:0;width:780px;height:44px;background:rgba(17,24,39,0.95);border-bottom:1px solid rgba(59,130,246,0.25);display:flex;align-items:center;padding:0 18px;box-sizing:border-box;">
            <span style="width:13px;height:13px;border-radius:50%;background:#ef4444;display:inline-block;margin-right:9px;"></span>
            <span style="width:13px;height:13px;border-radius:50%;background:#06b6d4;display:inline-block;margin-right:9px;"></span>
            <span style="width:13px;height:13px;border-radius:50%;background:#22c55e;display:inline-block;"></span>
            <span style="margin-left:18px;color:#64748b;font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:0;">bash — install</span>
          </div>
          <div style="position:relative;padding:74px 32px 40px 32px;">
            <div class="code" style="font-family:'JetBrains Mono','Fira Code',monospace;font-size:34px;font-weight:400;letter-spacing:0;line-height:1.5;white-space:pre;word-wrap:break-word;overflow-wrap:break-word;max-width:840px;">
              <span style="color:#22c55e;">$ </span><span style="color:#8b5cf6;">pip</span><span style="color:#f0f4ff;"> install </span><span style="color:#06b6d4;">numpy</span>
            </div>
            <div class="scan" style="position:absolute;top:0;left:-200px;width:160px;height:100%;background:linear-gradient(90deg,rgba(59,130,246,0) 0%,rgba(59,130,246,0.18) 45%,rgba(6,182,212,0.45) 50%,rgba(59,130,246,0.18) 55%,rgba(59,130,246,0) 100%);box-shadow:0 0 30px rgba(6,182,212,0.6);pointer-events:none;"></div>
            <div class="okline" style="margin-top:24px;font-family:'JetBrains Mono',monospace;font-size:26px;letter-spacing:0;color:#22c55e;opacity:0;">✓ Successfully installed numpy</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="caption-layer"><div id="caption-pill"><span class="w">and</span><span class="w">global</span><span class="w">packages</span><span class="w">separate</span><span class="w">so</span><span class="w">let&#x27;s</span><span class="w">install</span><span class="w">numpy</span><span class="w">so</span><span class="w">as</span><span class="w">you</span></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
(function () {
  var vars = window.__hyperframes && window.__hyperframes.getVariables
    ? window.__hyperframes.getVariables() : {};
  var tl = gsap.timeline();
  var root = document.getElementById('content');

  /* ── Claude's content timeline (scoped to #content) ── */
  (function (tl, root, vars) {
      const term = root.querySelector('.terminal');
      const scan = root.querySelector('.scan');
      const ok = root.querySelector('.okline');
      
      gsap.set(term, { opacity: 0, scale: 0.92, y: 20 });
      gsap.set(scan, { x: 0, opacity: 0 });
      gsap.set(ok, { opacity: 0, y: 8 });
      
      tl.to(term, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "cubic-bezier(0.34,1.56,0.64,1)" }, 0.1);
      
      tl.to(scan, { opacity: 1, duration: 0.2 }, 0.7);
      tl.to(scan, { x: 980, duration: 0.8, ease: "cubic-bezier(0,0,1,1)" }, 0.7);
      tl.to(scan, { opacity: 0, duration: 0.2 }, 1.5);
      
      tl.to(scan, { x: 0, opacity: 1, duration: 0.2 }, 3.4);
      tl.to(scan, { x: 980, duration: 0.8, ease: "cubic-bezier(0,0,1,1)" }, 3.6);
      tl.to(scan, { opacity: 0, duration: 0.2 }, 4.4);
      
      tl.to(ok, { opacity: 1, y: 0, duration: 0.4, ease: "cubic-bezier(0.34,1.56,0.64,1)" }, 4.7);
      
      tl.to(term, { opacity: 0, scale: 0.97, duration: 0.25, ease: "cubic-bezier(0.4,0,1,1)" }, 8.7);
  })(tl, root, vars);

  /* ── Caption timeline (Python-owned) ── */
  (function (tl) {
          var cw = document.querySelectorAll('#caption-pill .w');
          gsap.set(cw, { opacity: 0, y: 8 });
          tl.to(cw, { opacity: 1, y: 0, duration: 0.25, stagger: 0.1, ease: 'power2.out' }, 0.2);
  })(tl);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
