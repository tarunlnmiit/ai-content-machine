<!DOCTYPE html>
<html data-composition-fps="30" data-composition-duration="414" data-composition-variables='{"caption_text": {"type": "string", "default": "comes a point where every creator has to decide whether they are building a body of work or a costume a costume usually grows faster the work lasts longer and"}, "niche_color": {"type": "string", "default": "#3b82f6"}}'>
<head>
<meta charset="utf-8">
<style>
  /* === Python-owned base === */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    background: transparent;
    overflow: hidden;
  }
  #main {
    position: relative;
    width: 1920px; height: 1080px;
    overflow: hidden;
  }
  
    /* === Fullscreen layout === */
    #panel {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #content {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
  
  
    /* === Python-owned caption (fullscreen) === */
    #caption-layer {
      position: absolute;
      left: 0; right: 0;
      bottom: 80px;
      display: flex; justify-content: center; align-items: flex-end;
      pointer-events: none;
    }
  /* Caption pill */
  #caption-pill {
    max-width: 1860px;
    padding: 12px 24px;
    border-radius: 10px;
    background: rgba(10,14,26,0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #f0f4ff;
    font: 600 30px/1.4 'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  #caption-pill .w {
    display: inline-block;
    margin: 0 3px;
    opacity: 0;
  }
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-duration="13.800" data-width="1920" data-height="1080">
  
  <div id="panel">
    <div id="content">
      <div style="position:absolute; left:0; top:0; width:1920px; height:1080px; background:rgba(10,8,5,0.55); overflow:hidden;">
        <div style="position:absolute; left:0; top:0; width:1920px; height:1080px; background:radial-gradient(circle at 30% 35%, rgba(124,58,237,0.22), transparent 55%), radial-gradient(circle at 72% 68%, rgba(80,60,120,0.18), transparent 60%), radial-gradient(circle at 50% 50%, rgba(15,15,18,0.5), rgba(8,8,8,0.85) 90%);"></div>
        <div class="orb" style="position:absolute; left:540px; top:300px; width:840px; height:480px; border-radius:50%; background:radial-gradient(circle, rgba(124,58,237,0.16), transparent 70%); filter:blur(40px);"></div>
        <div class="fog" style="position:absolute; left:0; top:0; width:1920px; height:1080px; background:rgba(80,60,120,0.06);"></div>
      
        <div class="line line1" style="position:absolute; left:230px; top:430px; width:1460px; text-align:center; font-family:'Cormorant Garamond','Garamond','Georgia',serif; font-weight:400; font-size:84px; letter-spacing:0.05em; line-height:1.8; color:#f5f0eb; text-shadow:0 0 30px rgba(124,58,237,0.45), 0 2px 18px rgba(0,0,0,0.6);">a body of work</div>
      
        <div class="line line2" style="position:absolute; left:230px; top:560px; width:1460px; text-align:center; font-family:'Cormorant Garamond','Garamond','Georgia',serif; font-weight:600; font-style:italic; font-size:88px; letter-spacing:0.05em; line-height:1.8; color:#f5f0eb; text-shadow:0 0 36px rgba(124,58,237,0.55), 0 2px 18px rgba(0,0,0,0.6);">or a costume</div>
      </div>
    </div>
  </div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
(function () {
  var vars = window.__hyperframes && window.__hyperframes.getVariables
    ? window.__hyperframes.getVariables() : {};
  var tl = gsap.timeline();
  var root = document.getElementById('content');

  /* ── Claude's content timeline (scoped to #content) ── */
  (function (tl, root, vars) {
      gsap.set(root.querySelector('.line1'), { opacity: 0, y: 28, filter: 'blur(12px)' });
      gsap.set(root.querySelector('.line2'), { opacity: 0, y: 28, filter: 'blur(12px)' });
      gsap.set(root.querySelector('.orb'), { opacity: 0.4, scale: 0.92 });
      gsap.set(root.querySelector('.fog'), { opacity: 0 });
      
      tl.to(root.querySelector('.fog'), { opacity: 1, duration: 2.5, ease: 'cubic-bezier(0,0,1,1)' }, 0);
      tl.to(root.querySelector('.orb'), { opacity: 0.85, scale: 1.08, duration: 13.8, ease: 'cubic-bezier(0,0,1,1)' }, 0);
      
      // line 1 float up, soft glow
      tl.to(root.querySelector('.line1'), { opacity: 1, y: 0, filter: 'blur(0px)', duration: 1.4, ease: 'cubic-bezier(0.0,0.0,0.58,1.0)' }, 0.1);
      
      // line 2 enters at 1.8s, line 1 dims
      tl.to(root.querySelector('.line1'), { opacity: 0.42, filter: 'blur(2px)', duration: 1.0, ease: 'cubic-bezier(0.42,0,1.0,1.0)' }, 4.6);
      tl.to(root.querySelector('.line2'), { opacity: 1, y: 0, filter: 'blur(0px)', duration: 1.4, ease: 'cubic-bezier(0.0,0.0,0.58,1.0)' }, 4.6);
      
      // gentle breathing glow on emphasis line
      tl.to(root.querySelector('.line2'), { textShadow: '0 0 52px rgba(124,58,237,0.75), 0 2px 18px rgba(0,0,0,0.6)', duration: 3.0, ease: 'cubic-bezier(0.16,1,0.3,1)' }, 6.2);
      
      // soft exit
      tl.to([root.querySelector('.line1'), root.querySelector('.line2')], { opacity: 0, y: -22, filter: 'blur(8px)', duration: 0.8, ease: 'cubic-bezier(0.4,0,1,1)' }, 12.9);
  })(tl, root, vars);

  /* ── Caption timeline (Python-owned) ── */
  (function (tl) {

  })(tl);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
