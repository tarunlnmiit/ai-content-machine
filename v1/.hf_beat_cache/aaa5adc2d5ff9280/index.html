<!DOCTYPE html>
<html data-composition-fps="30" data-composition-duration="180" data-composition-variables='{"caption_text": {"type": "string", "default": "churn sleep hours steps we have built entire industries around quantifying being"}, "niche_color": {"type": "string", "default": "#3b82f6"}}'>
<head>
<meta charset="utf-8">
<style>
  /* === Python-owned base === */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    background: transparent;
    overflow: hidden;
  }
  #main {
    position: relative;
    width: 1920px; height: 1080px;
    overflow: hidden;
  }
  
    /* === Python-owned panel geometry === */
    #panel {
      position: absolute;
      left: 980px; top: 60px;
      width: 900px; height: 960px;
      overflow: hidden;
      border-radius: 20px;
      background: rgba(17,24,39,0.88);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 8px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    /* Specular highlight at panel top edge */
    #panel::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.14), transparent);
      z-index: 100;
    }
    /* Claude's content is scoped here. (0,0) = panel top-left. */
    #content {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
  
  
    /* === Python-owned caption (sibling of #panel, never clipped) === */
    #caption-layer {
      position: absolute;
      left: 0px; width: 1920px;
      bottom: 80px;
      display: flex; justify-content: center; align-items: flex-end;
      pointer-events: none;
    }
  /* Caption pill */
  #caption-pill {
    max-width: 840px;
    padding: 12px 24px;
    border-radius: 10px;
    background: rgba(10,14,26,0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #f0f4ff;
    font: 600 30px/1.4 'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  #caption-pill .w {
    display: inline-block;
    margin: 0 3px;
    opacity: 0;
  }
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-duration="6.000" data-width="1920" data-height="1080">
  
  <div id="panel">
    <div id="content">
      <div style="position:absolute; top:0; left:0; width:900px; height:960px; background:#1a1208; overflow:hidden; display:flex; flex-direction:column; justify-content:center; align-items:center;">
        <div style="position:absolute; top:120px; left:170px; width:560px; height:1px; background:linear-gradient(90deg,transparent,rgba(245,158,11,0.4),transparent);"></div>
        <div class="qmark" style="position:absolute; top:150px; left:80px; font-family:'Playfair Display','Georgia',serif; font-weight:700; font-size:200px; color:rgba(245,158,11,0.12); line-height:1;">&ldquo;</div>
      
        <div style="position:relative; width:760px; padding:0 70px; text-align:center;">
          <div class="line1" style="font-family:'Cormorant Garamond','Playfair Display','Georgia',serif; font-style:italic; font-weight:500; font-size:68px; line-height:1.25; letter-spacing:-0.01em; color:#fdf8f0; word-wrap:break-word; overflow-wrap:break-word; max-width:840px;">
            We built industries around quantifying being human
          </div>
          <div class="line2" style="font-family:'Cormorant Garamond','Playfair Display','Georgia',serif; font-style:italic; font-weight:600; font-size:68px; line-height:1.25; letter-spacing:-0.01em; margin-top:28px; word-wrap:break-word; overflow-wrap:break-word; max-width:840px; background:linear-gradient(135deg,#f59e0b,#ef4444); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:#f59e0b; text-shadow:0 0 30px rgba(245,158,11,0.0);">
            but no metric for what we carry
          </div>
        </div>
      
        <div style="position:absolute; bottom:140px; left:300px; width:300px; height:1px; background:linear-gradient(90deg,transparent,rgba(134,239,172,0.35),transparent);"></div>
      </div>
    </div>
  </div>
  <div id="caption-layer"><div id="caption-pill"><span class="w">churn</span><span class="w">sleep</span><span class="w">hours</span><span class="w">steps</span><span class="w">we</span><span class="w">have</span><span class="w">built</span><span class="w">entire</span><span class="w">industries</span><span class="w">around</span><span class="w">quantifying</span><span class="w">being</span></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
(function () {
  var vars = window.__hyperframes && window.__hyperframes.getVariables
    ? window.__hyperframes.getVariables() : {};
  var tl = gsap.timeline();
  var root = document.getElementById('content');

  /* ── Claude's content timeline (scoped to #content) ── */
  (function (tl, root, vars) {
      const line1 = root.querySelector('.line1');
      const line2 = root.querySelector('.line2');
      const qmark = root.querySelector('.qmark');
      
      gsap.set(line1, { opacity: 0, y: 20, scale: 0.96 });
      gsap.set(line2, { opacity: 0, y: 20, scale: 0.96 });
      gsap.set(qmark, { opacity: 0, scale: 0.7, transformOrigin: '50% 50%' });
      
      // Quote mark drifts in
      tl.to(qmark, { opacity: 1, scale: 1, duration: 0.8, ease: 'cubic-bezier(0.34,1.56,0.64,1)' }, 0.0);
      
      // Line 1 reveals
      tl.to(line1, { opacity: 1, y: 0, scale: 1, duration: 1.0, ease: 'cubic-bezier(0.34,1.56,0.64,1)' }, 0.1);
      
      // Line 1 dims as line 2 reveals
      tl.to(line1, { opacity: 0.32, duration: 0.6, ease: 'cubic-bezier(0.25,0.46,0.45,0.94)' }, 1.8);
      tl.to(line2, { opacity: 1, y: 0, scale: 1, duration: 1.0, ease: 'cubic-bezier(0.34,1.56,0.64,1)' }, 1.8);
      
      // Emotional glow swell on the payoff line
      tl.to(line2, { textShadow: '0 0 36px rgba(245,158,11,0.55)', duration: 1.2, ease: 'cubic-bezier(0.0,0.0,0.2,1)' }, 2.4);
      
      // Gentle settle hold to end
      tl.to(line2, { scale: 1.015, duration: 1.6, ease: 'cubic-bezier(0.0,0.0,0.2,1)' }, 3.6);
  })(tl, root, vars);

  /* ── Caption timeline (Python-owned) ── */
  (function (tl) {
          var cw = document.querySelectorAll('#caption-pill .w');
          gsap.set(cw, { opacity: 0, y: 8 });
          tl.to(cw, { opacity: 1, y: 0, duration: 0.25, stagger: 0.1, ease: 'power2.out' }, 0.2);
  })(tl);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
