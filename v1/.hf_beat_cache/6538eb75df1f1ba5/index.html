<!DOCTYPE html>
<html data-composition-fps="30" data-composition-duration="180" data-composition-variables='{"caption_text": {"type": "string", "default": "someone carries something heavy long enough and they start to seem adjacent to their"}, "niche_color": {"type": "string", "default": "#3b82f6"}}'>
<head>
<meta charset="utf-8">
<style>
  /* === Python-owned base === */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    background: transparent;
    overflow: hidden;
  }
  #main {
    position: relative;
    width: 1920px; height: 1080px;
    overflow: hidden;
  }
  
    /* === Python-owned panel geometry === */
    #panel {
      position: absolute;
      left: 980px; top: 60px;
      width: 900px; height: 960px;
      overflow: hidden;
      border-radius: 20px;
      background: rgba(17,24,39,0.88);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 8px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    /* Specular highlight at panel top edge */
    #panel::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.14), transparent);
      z-index: 100;
    }
    /* Claude's content is scoped here. (0,0) = panel top-left. */
    #content {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
  
  
    /* === Python-owned caption (sibling of #panel, never clipped) === */
    #caption-layer {
      position: absolute;
      left: 0px; width: 1920px;
      bottom: 80px;
      display: flex; justify-content: center; align-items: flex-end;
      pointer-events: none;
    }
  /* Caption pill */
  #caption-pill {
    max-width: 840px;
    padding: 12px 24px;
    border-radius: 10px;
    background: rgba(10,14,26,0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #f0f4ff;
    font: 600 30px/1.4 'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  #caption-pill .w {
    display: inline-block;
    margin: 0 3px;
    opacity: 0;
  }
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-duration="6.000" data-width="1920" data-height="1080">
  
  <div id="panel">
    <div id="content">
      <div style="position:absolute; top:0; left:0; width:900px; height:960px; background:linear-gradient(160deg,#1a1208 0%,#231a0e 100%); overflow:hidden;">
        <div class="grain" style="position:absolute; top:0; left:0; width:900px; height:960px; opacity:0.06; background-image:radial-gradient(rgba(245,158,11,0.4) 1px, transparent 1px); background-size:4px 4px;"></div>
        <div class="mark" style="position:absolute; top:300px; left:80px; width:60px; height:4px; background:#f59e0b; border-radius:2px;"></div>
        <div style="position:absolute; top:340px; left:80px; width:740px; max-width:840px;">
          <p class="ln1" style="margin:0; font-family:'Playfair Display','Georgia',serif; font-style:italic; font-weight:400; font-size:58px; line-height:1.3; letter-spacing:-0.01em; color:#fdf8f0; word-wrap:break-word; overflow-wrap:break-word;">Present but not quite there —</p>
          <p class="ln2" style="margin:28px 0 0 0; font-family:'Playfair Display','Georgia',serif; font-style:italic; font-weight:400; font-size:58px; line-height:1.3; letter-spacing:-0.01em; color:#f59e0b; word-wrap:break-word; overflow-wrap:break-word;">like there's glass between you.</p>
        </div>
        <div class="quote" style="position:absolute; top:200px; left:64px; font-family:'Playfair Display','Georgia',serif; font-weight:700; font-size:160px; line-height:1; color:rgba(245,158,11,0.16);">"</div>
      </div>
    </div>
  </div>
  <div id="caption-layer"><div id="caption-pill"><span class="w">someone</span><span class="w">carries</span><span class="w">something</span><span class="w">heavy</span><span class="w">long</span><span class="w">enough</span><span class="w">and</span><span class="w">they</span><span class="w">start</span><span class="w">to</span><span class="w">seem</span><span class="w">adjacent</span><span class="w">to</span><span class="w">their</span></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
(function () {
  var vars = window.__hyperframes && window.__hyperframes.getVariables
    ? window.__hyperframes.getVariables() : {};
  var tl = gsap.timeline();
  var root = document.getElementById('content');

  /* ── Claude's content timeline (scoped to #content) ── */
  (function (tl, root, vars) {
      gsap.set(root.querySelector('.grain'), { opacity: 0 });
      gsap.set(root.querySelector('.mark'), { scaleX: 0, transformOrigin: 'left center', opacity: 0 });
      gsap.set(root.querySelector('.quote'), { opacity: 0, scale: 0.8, transformOrigin: 'left top' });
      gsap.set(root.querySelector('.ln1'), { opacity: 0, y: 20 });
      gsap.set(root.querySelector('.ln2'), { opacity: 0, y: 20 });
      
      tl.to(root.querySelector('.grain'), { opacity: 0.06, duration: 0.8 }, 0);
      tl.to(root.querySelector('.quote'), { opacity: 1, scale: 1, duration: 0.9, ease: 'cubic-bezier(0.34,1.56,0.64,1)' }, 0);
      tl.to(root.querySelector('.mark'), { scaleX: 1, opacity: 1, duration: 0.6, ease: 'cubic-bezier(0.16,1,0.3,1)' }, 0.1);
      
      // Line 1 reveal
      tl.to(root.querySelector('.ln1'), { opacity: 1, y: 0, duration: 1.0, ease: 'cubic-bezier(0.34,1.56,0.64,1)' }, 0.1);
      
      // Line 2 reveal at t=1.8s, line 1 dims
      tl.to(root.querySelector('.ln1'), { opacity: 0.4, duration: 0.6, ease: 'cubic-bezier(0.25,0.46,0.45,0.94)' }, 1.8);
      tl.to(root.querySelector('.ln2'), { opacity: 1, y: 0, duration: 1.0, ease: 'cubic-bezier(0.34,1.56,0.64,1)' }, 1.8);
      
      // Gentle hold breathe on accent line
      tl.to(root.querySelector('.ln2'), { filter: 'drop-shadow(0 0 18px rgba(245,158,11,0.35))', duration: 1.4, ease: 'cubic-bezier(0.0,0.0,0.2,1)' }, 3.2);
  })(tl, root, vars);

  /* ── Caption timeline (Python-owned) ── */
  (function (tl) {
          var cw = document.querySelectorAll('#caption-pill .w');
          gsap.set(cw, { opacity: 0, y: 8 });
          tl.to(cw, { opacity: 1, y: 0, duration: 0.25, stagger: 0.1, ease: 'power2.out' }, 0.2);
  })(tl);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
