<!DOCTYPE html>
<html data-composition-fps="30" data-composition-duration="360" data-composition-variables='{"caption_text": {"type": "string", "default": "at some point your python loop stops being fast enough not theoretically you will feel it you will run a calculation on 100 000 rows and your laptop fan will spin up"}, "niche_color": {"type": "string", "default": "#3b82f6"}}'>
<head>
<meta charset="utf-8">
<style>
  /* === Python-owned base === */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    background: #0a0e1a;
    overflow: hidden;
  }
  #main {
    position: relative;
    width: 1920px; height: 1080px;
    overflow: hidden;
  }
  
    /* === Fullscreen layout === */
    #panel {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #content {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
  
    /* Fullscreen ambient background */
    #ambient {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 15% 30%, rgba(59,130,246,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 70% at 85% 75%, rgba(139,92,246,0.09) 0%, transparent 60%),
        #0a0e1a;
    }
  
    /* === Python-owned caption (fullscreen) === */
    #caption-layer {
      position: absolute;
      left: 0; right: 0;
      bottom: 80px;
      display: flex; justify-content: center; align-items: flex-end;
      pointer-events: none;
    }
  /* Caption pill */
  #caption-pill {
    max-width: 1860px;
    padding: 12px 24px;
    border-radius: 10px;
    background: rgba(10,14,26,0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #f0f4ff;
    font: 600 30px/1.4 'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  #caption-pill .w {
    display: inline-block;
    margin: 0 3px;
    opacity: 0;
  }
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-duration="12.000" data-width="1920" data-height="1080">
    <div id="ambient"></div>
  <div id="panel">
    <div id="content">
      <div style="position:absolute; left:0; top:0; width:1920px; height:1080px; overflow:hidden; background:
          radial-gradient(circle at 25% 30%, rgba(59,130,246,0.18), transparent 45%),
          radial-gradient(circle at 75% 70%, rgba(139,92,246,0.16), transparent 45%),
          radial-gradient(circle at 50% 100%, rgba(6,182,212,0.12), transparent 55%),
          #0a0e1a;">
        <div class="orb" style="position:absolute; left:140px; top:120px; width:520px; height:520px; border-radius:50%; background:radial-gradient(circle, rgba(6,182,212,0.20), transparent 70%); filter:blur(40px);"></div>
        <div class="orb2" style="position:absolute; left:1240px; top:480px; width:560px; height:560px; border-radius:50%; background:radial-gradient(circle, rgba(139,92,246,0.20), transparent 70%); filter:blur(40px);"></div>
        <div class="line1" style="position:absolute; left:360px; top:430px; width:1200px; text-align:center; font-family:'Inter','SF Pro Display',sans-serif; font-weight:900; font-size:160px; letter-spacing:-0.02em; line-height:1.2; background:linear-gradient(135deg,#3b82f6,#8b5cf6,#06b6d4); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent; text-shadow:0 0 30px rgba(59,130,246,0.7);">0.08s</div>
        <div class="line2" style="position:absolute; left:360px; top:560px; width:1200px; text-align:center; font-family:'Inter','SF Pro Display',sans-serif; font-weight:800; font-size:96px; letter-spacing:-0.02em; line-height:1.2; color:#f0f4ff; text-shadow:0 0 30px rgba(239,68,68,0.5);">not 12s</div>
      </div>
    </div>
  </div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
(function () {
  var vars = window.__hyperframes && window.__hyperframes.getVariables
    ? window.__hyperframes.getVariables() : {};
  var tl = gsap.timeline();
  var root = document.getElementById('content');

  /* ── Claude's content timeline (scoped to #content) ── */
  (function (tl, root, vars) {
      gsap.set(root.querySelector('.line1'), { opacity: 0, scale: 0.92, y: 20 });
      gsap.set(root.querySelector('.line2'), { opacity: 0, scale: 0.92, y: 20 });
      gsap.set(root.querySelector('.orb'), { opacity: 0, scale: 0.7 });
      gsap.set(root.querySelector('.orb2'), { opacity: 0, scale: 0.7 });
      
      tl.to(root.querySelector('.orb'), { opacity: 1, scale: 1, duration: 2.0, ease: 'cubic-bezier(0.16,1,0.3,1)' }, 0);
      tl.to(root.querySelector('.orb2'), { opacity: 1, scale: 1, duration: 2.0, ease: 'cubic-bezier(0.16,1,0.3,1)' }, 0.2);
      
      // line 1 in
      tl.to(root.querySelector('.line1'), { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: 'cubic-bezier(0.34,1.56,0.64,1)' }, 0.1);
      
      // line 2 in, line 1 dims
      tl.to(root.querySelector('.line1'), { opacity: 0.35, scale: 0.88, duration: 0.5, ease: 'cubic-bezier(0.4,0,1,1)' }, 1.8);
      tl.to(root.querySelector('.line2'), { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: 'cubic-bezier(0.34,1.56,0.64,1)' }, 1.8);
      
      // slow orb drift through hold
      tl.to(root.querySelector('.orb'), { x: 60, y: -40, duration: 8.0, ease: 'cubic-bezier(0,0,1,1)' }, 2.0);
      tl.to(root.querySelector('.orb2'), { x: -60, y: 40, duration: 8.0, ease: 'cubic-bezier(0,0,1,1)' }, 2.0);
      
      // gentle exit
      tl.to([root.querySelector('.line1'), root.querySelector('.line2')], { opacity: 0, y: -20, duration: 0.25, ease: 'cubic-bezier(0.4,0,1,1)' }, 11.6);
  })(tl, root, vars);

  /* ── Caption timeline (Python-owned) ── */
  (function (tl) {

  })(tl);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
