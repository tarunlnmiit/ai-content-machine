<!DOCTYPE html>
<html data-composition-fps="30" data-composition-duration="270" data-composition-variables='{"caption_text": {"type": "string", "default": "you get a boolean array where the condition holds and false where it does not then use that boolean array as an index to filter your original"}, "niche_color": {"type": "string", "default": "#3b82f6"}}'>
<head>
<meta charset="utf-8">
<style>
  /* === Python-owned base === */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    background: transparent;
    overflow: hidden;
  }
  #main {
    position: relative;
    width: 1920px; height: 1080px;
    overflow: hidden;
  }
  
    /* === Python-owned panel geometry === */
    #panel {
      position: absolute;
      left: 980px; top: 60px;
      width: 900px; height: 960px;
      overflow: hidden;
      border-radius: 20px;
      background: rgba(17,24,39,0.88);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 8px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    /* Specular highlight at panel top edge */
    #panel::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.14), transparent);
      z-index: 100;
    }
    /* Claude's content is scoped here. (0,0) = panel top-left. */
    #content {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
  
  
    /* === Python-owned caption (sibling of #panel, never clipped) === */
    #caption-layer {
      position: absolute;
      left: 0px; width: 1920px;
      bottom: 80px;
      display: flex; justify-content: center; align-items: flex-end;
      pointer-events: none;
    }
  /* Caption pill */
  #caption-pill {
    max-width: 840px;
    padding: 12px 24px;
    border-radius: 10px;
    background: rgba(10,14,26,0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #f0f4ff;
    font: 600 30px/1.4 'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  #caption-pill .w {
    display: inline-block;
    margin: 0 3px;
    opacity: 0;
  }
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-duration="9.000" data-width="1920" data-height="1080">
  
  <div id="panel">
    <div id="content">
      <div style="position:absolute; top:0; left:0; width:900px; height:960px; overflow:hidden; font-family:'JetBrains Mono','Fira Code',monospace;">
      
        <!-- scanline texture overlay -->
        <div class="scanlines" style="position:absolute; top:0; left:0; width:900px; height:960px; background:repeating-linear-gradient(0deg, rgba(59,130,246,0.06) 0px, rgba(59,130,246,0.06) 1px, transparent 1px, transparent 4px); pointer-events:none; opacity:0;"></div>
      
        <!-- corner brackets -->
        <div class="bk bk-tl" style="position:absolute; top:140px; left:90px; width:48px; height:48px; border-top:3px solid #06b6d4; border-left:3px solid #06b6d4; opacity:0;"></div>
        <div class="bk bk-tr" style="position:absolute; top:140px; left:762px; width:48px; height:48px; border-top:3px solid #06b6d4; border-right:3px solid #06b6d4; opacity:0;"></div>
        <div class="bk bk-bl" style="position:absolute; top:772px; left:90px; width:48px; height:48px; border-bottom:3px solid #06b6d4; border-left:3px solid #06b6d4; opacity:0;"></div>
        <div class="bk bk-br" style="position:absolute; top:772px; left:762px; width:48px; height:48px; border-bottom:3px solid #06b6d4; border-right:3px solid #06b6d4; opacity:0;"></div>
      
        <!-- HUD readout label -->
        <div class="hud-label" style="position:absolute; top:175px; left:130px; font-size:24px; font-weight:400; letter-spacing:4px; color:#64748b; opacity:0;">// BOOLEAN MASK</div>
      
        <!-- status pill -->
        <div class="hud-status" style="position:absolute; top:170px; left:600px; padding:6px 16px; border:1px solid rgba(34,197,94,0.5); border-radius:4px; font-size:20px; letter-spacing:2px; color:#22c55e; opacity:0;">● LIVE</div>
      
        <!-- main code readout -->
        <div class="code-line" style="position:absolute; top:420px; left:130px; width:640px; font-size:46px; line-height:1.4; color:#f0f4ff; opacity:0;">
          <span style="color:#8b5cf6;">mask</span> <span style="color:#64748b;">=</span> <span style="color:#06b6d4;">scores</span> <span style="color:#3b82f6;">&gt;</span> <span style="color:#22c55e;">90</span>
        </div>
      
        <!-- arrow -->
        <div class="code-arrow" style="position:absolute; top:540px; left:130px; font-size:40px; color:#3b82f6; opacity:0; text-shadow:0 0 20px rgba(59,130,246,0.7);">↓</div>
      
        <!-- result readout -->
        <div class="code-result" style="position:absolute; top:600px; left:130px; width:640px; font-size:46px; line-height:1.4; color:#f0f4ff; opacity:0;">
          <span style="color:#06b6d4;">scores</span><span style="color:#64748b;">[</span><span style="color:#8b5cf6;">mask</span><span style="color:#64748b;">]</span>
        </div>
      
        <!-- scan bar -->
        <div class="scanbar" style="position:absolute; top:380px; left:120px; width:660px; height:3px; background:linear-gradient(90deg, transparent, #06b6d4, transparent); box-shadow:0 0 16px rgba(6,182,212,0.9); opacity:0;"></div>
      
      </div>
    </div>
  </div>
  <div id="caption-layer"><div id="caption-pill"><span class="w">you</span><span class="w">get</span><span class="w">a</span><span class="w">boolean</span><span class="w">array</span><span class="w">where</span><span class="w">the</span><span class="w">condition</span><span class="w">holds</span><span class="w">and</span><span class="w">false</span><span class="w">where</span><span class="w">it</span><span class="w">does</span><span class="w">not</span><span class="w">then</span><span class="w">use</span><span class="w">that</span><span class="w">boolean</span><span class="w">array</span><span class="w">as</span><span class="w">an</span><span class="w">index</span><span class="w">to</span><span class="w">filter</span><span class="w">your</span><span class="w">original</span></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
(function () {
  var vars = window.__hyperframes && window.__hyperframes.getVariables
    ? window.__hyperframes.getVariables() : {};
  var tl = gsap.timeline();
  var root = document.getElementById('content');

  /* ── Claude's content timeline (scoped to #content) ── */
  (function (tl, root, vars) {
      gsap.set(root.querySelector('.scanlines'), {opacity:1});
      gsap.set([root.querySelector('.bk-tl'),root.querySelector('.bk-tr'),root.querySelector('.bk-bl'),root.querySelector('.bk-br')], {scale:0.6, transformOrigin:'center'});
      
      // corner brackets snap in
      tl.to([root.querySelector('.bk-tl'),root.querySelector('.bk-tr'),root.querySelector('.bk-bl'),root.querySelector('.bk-br')],
        {opacity:1, scale:1, duration:0.5, stagger:0.08, ease:"cubic-bezier(0.34,1.56,0.64,1)"}, 0.1);
      
      // labels
      tl.to(root.querySelector('.hud-label'), {opacity:1, x:0, duration:0.4, ease:"cubic-bezier(0.16,1,0.3,1)"}, 0.4);
      tl.fromTo(root.querySelector('.hud-status'), {x:20}, {opacity:1, x:0, duration:0.4, ease:"cubic-bezier(0.16,1,0.3,1)"}, 0.5);
      
      // scan bar sweep down over code area
      tl.to(root.querySelector('.scanbar'), {opacity:1, duration:0.2}, 0.9);
      tl.to(root.querySelector('.scanbar'), {y:260, duration:0.8, ease:"cubic-bezier(0,0,1,1)"}, 0.9);
      tl.to(root.querySelector('.scanbar'), {opacity:0, duration:0.2}, 1.7);
      
      // main code line reveals
      tl.fromTo(root.querySelector('.code-line'), {y:20, scale:0.96}, {opacity:1, y:0, scale:1, duration:0.5, ease:"cubic-bezier(0.34,1.56,0.64,1)"}, 1.1);
      
      // arrow
      tl.fromTo(root.querySelector('.code-arrow'), {y:-10}, {opacity:1, y:0, duration:0.4, ease:"cubic-bezier(0.34,1.56,0.64,1)"}, 1.8);
      
      // result line
      tl.fromTo(root.querySelector('.code-result'), {y:20, scale:0.96}, {opacity:1, y:0, scale:1, duration:0.5, ease:"cubic-bezier(0.34,1.56,0.64,1)"}, 2.1);
      
      // subtle status pulse
      tl.to(root.querySelector('.hud-status'), {opacity:0.4, duration:0.6, repeat:6, yoyo:true, ease:"cubic-bezier(0,0,1,1)"}, 3.0);
      
      // hold, then gentle exit
      tl.to(root.querySelectorAll('.code-line, .code-arrow, .code-result, .hud-label, .hud-status, .bk, .scanlines'),
        {opacity:0, duration:0.25, ease:"cubic-bezier(0.4,0,1,1)"}, 8.6);
  })(tl, root, vars);

  /* ── Caption timeline (Python-owned) ── */
  (function (tl) {
          var cw = document.querySelectorAll('#caption-pill .w');
          gsap.set(cw, { opacity: 0, y: 8 });
          tl.to(cw, { opacity: 1, y: 0, duration: 0.25, stagger: 0.1, ease: 'power2.out' }, 0.2);
  })(tl);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
