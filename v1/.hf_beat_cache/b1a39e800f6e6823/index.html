<!DOCTYPE html>
<html data-composition-fps="30" data-composition-duration="270" data-composition-variables='{"caption_text": {"type": "string", "default": "you would write a loop append to a new list and you would have your answer eventually or you could use a list comprehension as well in numpy you can"}, "niche_color": {"type": "string", "default": "#3b82f6"}}'>
<head>
<meta charset="utf-8">
<style>
  /* === Python-owned base === */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    background: transparent;
    overflow: hidden;
  }
  #main {
    position: relative;
    width: 1920px; height: 1080px;
    overflow: hidden;
  }
  
    /* === Python-owned panel geometry === */
    #panel {
      position: absolute;
      left: 60px; top: 40px;
      width: 1800px; height: 480px;
      overflow: hidden;
      border-radius: 0 0 20px 20px;
      background: rgba(17,24,39,0.88);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 8px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    /* Specular highlight at panel top edge */
    #panel::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.14), transparent);
      z-index: 100;
    }
    /* Claude's content is scoped here. (0,0) = panel top-left. */
    #content {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
  
  
    /* === Python-owned caption (sibling of #panel, never clipped) === */
    #caption-layer {
      position: absolute;
      left: 0px; width: 1920px;
      bottom: 80px;
      display: flex; justify-content: center; align-items: flex-end;
      pointer-events: none;
    }
  /* Caption pill */
  #caption-pill {
    max-width: 1740px;
    padding: 12px 24px;
    border-radius: 10px;
    background: rgba(10,14,26,0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #f0f4ff;
    font: 600 30px/1.4 'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  #caption-pill .w {
    display: inline-block;
    margin: 0 3px;
    opacity: 0;
  }
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-duration="9.000" data-width="1920" data-height="1080">
  
  <div id="panel">
    <div id="content">
      <div style="position:absolute; left:0; top:0; width:1800px; height:480px; background:#0a0e1a; overflow:hidden;">
        <div class="card" style="position:absolute; left:80px; top:60px; width:1640px; height:360px; background:#111827; border:3px solid #3b82f6; box-shadow:18px 18px 0 #8b5cf6; display:flex; flex-direction:column; justify-content:center; padding:0 90px; box-sizing:border-box;">
          <div class="line1" style="font-family:'Inter','SF Pro Display',Arial,sans-serif; font-weight:800; font-size:78px; letter-spacing:-0.02em; line-height:1.2; color:#f0f4ff; max-width:1420px; word-wrap:break-word; overflow-wrap:break-word; text-shadow:0 0 30px rgba(59,130,246,0.7);">Stop looping.</div>
          <div class="line2" style="font-family:'Inter','SF Pro Display',Arial,sans-serif; font-weight:800; font-size:78px; letter-spacing:-0.02em; line-height:1.2; max-width:1420px; word-wrap:break-word; overflow-wrap:break-word; background:linear-gradient(135deg,#3b82f6,#8b5cf6,#06b6d4); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; margin-top:18px;">Start describing.</div>
          <div class="accent" style="position:absolute; left:90px; top:60px; width:120px; height:6px; background:#06b6d4;"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="caption-layer"><div id="caption-pill"><span class="w">you</span><span class="w">would</span><span class="w">write</span><span class="w">a</span><span class="w">loop</span><span class="w">append</span><span class="w">to</span><span class="w">a</span><span class="w">new</span><span class="w">list</span><span class="w">and</span><span class="w">you</span><span class="w">would</span><span class="w">have</span><span class="w">your</span><span class="w">answer</span><span class="w">eventually</span><span class="w">or</span><span class="w">you</span><span class="w">could</span><span class="w">use</span><span class="w">a</span><span class="w">list</span><span class="w">comprehension</span><span class="w">as</span><span class="w">well</span><span class="w">in</span><span class="w">numpy</span><span class="w">you</span><span class="w">can</span></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
(function () {
  var vars = window.__hyperframes && window.__hyperframes.getVariables
    ? window.__hyperframes.getVariables() : {};
  var tl = gsap.timeline();
  var root = document.getElementById('content');

  /* ── Claude's content timeline (scoped to #content) ── */
  (function (tl, root, vars) {
      gsap.set(root.querySelector('.card'), { opacity: 0, scale: 0.92, y: 20 });
      gsap.set(root.querySelector('.line1'), { opacity: 0, y: 18 });
      gsap.set(root.querySelector('.line2'), { opacity: 0, y: 18 });
      gsap.set(root.querySelector('.accent'), { scaleX: 0, transformOrigin: 'left center' });
      
      tl.to(root.querySelector('.card'), {
        opacity: 1, scale: 1, y: 0, duration: 0.5,
        ease: 'cubic-bezier(0.34,1.56,0.64,1)'
      }, 0.0);
      
      tl.to(root.querySelector('.accent'), {
        scaleX: 1, duration: 0.6, ease: 'cubic-bezier(0,0,1,1)'
      }, 0.2);
      
      tl.to(root.querySelector('.line1'), {
        opacity: 1, y: 0, duration: 0.5,
        ease: 'cubic-bezier(0.34,1.56,0.64,1)'
      }, 0.1);
      
      tl.to(root.querySelector('.line1'), {
        opacity: 0.28, duration: 0.4, ease: 'cubic-bezier(0.4,0,1,1)'
      }, 1.8);
      
      tl.to(root.querySelector('.line2'), {
        opacity: 1, y: 0, duration: 0.5,
        ease: 'cubic-bezier(0.34,1.56,0.64,1)'
      }, 1.8);
  })(tl, root, vars);

  /* ── Caption timeline (Python-owned) ── */
  (function (tl) {
          var cw = document.querySelectorAll('#caption-pill .w');
          gsap.set(cw, { opacity: 0, y: 8 });
          tl.to(cw, { opacity: 1, y: 0, duration: 0.25, stagger: 0.1, ease: 'power2.out' }, 0.2);
  })(tl);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
