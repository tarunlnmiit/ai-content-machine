<!DOCTYPE html>
<html data-composition-fps="30" data-composition-duration="256" data-composition-variables='{"caption_text": {"type": "string", "default": "model everyone has i just stopped asking like a tourist comment prompt and i will dm you the whole thing copy paste ready"}, "niche_color": {"type": "string", "default": "#3b82f6"}}'>
<head>
<meta charset="utf-8">
<style>
  /* === Python-owned base === */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1920px;
    background: transparent;
    overflow: hidden;
  }
  #main {
    position: relative;
    width: 1080px; height: 1920px;
    overflow: hidden;
  }
  
    /* === Fullscreen layout === */
    #panel {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #content {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
  
    /* Fullscreen ambient background */
    #ambient {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 15% 30%, rgba(59,130,246,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 70% at 85% 75%, rgba(139,92,246,0.09) 0%, transparent 60%),
        #0a0e1a;
    }
  
    /* === Python-owned caption (fullscreen) === */
    #caption-layer {
      position: absolute;
      left: 0; right: 0;
      bottom: 80px;
      display: flex; justify-content: center; align-items: flex-end;
      pointer-events: none;
    }
  /* Caption pill */
  #caption-pill {
    max-width: 1020px;
    padding: 12px 24px;
    border-radius: 10px;
    background: rgba(10,14,26,0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #f0f4ff;
    font: 600 30px/1.4 'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  #caption-pill .w {
    display: inline-block;
    margin: 0 3px;
    opacity: 0;
  }
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-duration="8.540" data-width="1080" data-height="1920">
    
  <div id="panel">
    <div id="content">

      <div class='pk-scrim' style="position:absolute;left:0;right:0;top:0;height:760px;pointer-events:none;background:linear-gradient(to top,transparent 0%,rgba(4,6,10,0.45) 46%,rgba(4,6,10,0.9) 100%);"></div>
      <div class="pk-cta" style="position:absolute;top:250px;left:0;right:0;display:flex;justify-content:center;">
        <div style="display:flex;align-items:center;gap:20px;padding:26px 48px;border-radius:100px;
             background:#4da3ff;color:#04121f;font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,monospace;font-weight:700;font-size:40px;
             letter-spacing:0.04em;box-shadow:0 0 44px rgba(77,163,255,0.5);">
          Comment <span style="background:#04121f;color:#4da3ff;padding:5px 20px;border-radius:12px;">PROMPT</span></div>
      </div>
      <div class="pk-sub" style="position:absolute;top:378px;left:0;right:0;text-align:center;
           font-family:Inter,'SF Pro Display','Helvetica Neue',Arial,sans-serif;font-size:36px;color:#eef2f9;">→ I'll DM the full copy-paste prompt</div>
    
    </div>
  </div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
(function () {
  var vars = window.__hyperframes && window.__hyperframes.getVariables
    ? window.__hyperframes.getVariables() : {};
  var tl = gsap.timeline();
  var root = document.getElementById('content');

  /* ── Claude's content timeline (scoped to #content) ── */
  (function (tl, root, vars) {

      const cta=root.querySelector('.pk-cta'),sub=root.querySelector('.pk-sub');
      gsap.set(cta,{opacity:0,scale:0.9,y:16});
      gsap.set(sub,{opacity:0,y:14});
      tl.to(cta,{opacity:1,scale:1,y:0,duration:0.55,ease:'back.out(1.7)'},0.2);
      tl.to(sub,{opacity:1,y:0,duration:0.5,ease:'power2.out'},0.5);
    
  })(tl, root, vars);

  /* ── Caption timeline (Python-owned) ── */
  (function (tl) {

  })(tl);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
