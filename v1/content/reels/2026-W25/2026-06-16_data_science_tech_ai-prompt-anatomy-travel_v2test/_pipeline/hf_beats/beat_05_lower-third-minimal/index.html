<!DOCTYPE html>
<html data-composition-fps="30" data-composition-duration="72" data-composition-variables='{"caption_text": {"type": "string", "default": "with the era and the address"}, "niche_color": {"type": "string", "default": "#3b82f6"}}'>
<head>
<meta charset="utf-8">
<style>
  /* === Python-owned base === */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1920px;
    background: transparent;
    overflow: hidden;
  }
  #main {
    position: relative;
    width: 1080px; height: 1920px;
    overflow: hidden;
  }
  
    /* === Python-owned panel geometry === */
    #panel {
      position: absolute;
      left: 0px; top: 1440px;
      width: 1080px; height: 480px;
      overflow: hidden;
      border-radius: 20px 20px 0 0;
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border: 0;
      box-shadow: none;
    }
    /* Specular highlight at panel top edge */
    #panel::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(to right, transparent, transparent, transparent);
      z-index: 100;
    }
    /* Claude's content is scoped here. (0,0) = panel top-left. */
    #content {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
  
  
    /* === Python-owned caption (sibling of #panel, never clipped) === */
    #caption-layer {
      position: absolute;
      left: 0px; width: 1080px;
      bottom: 492px;
      display: flex; justify-content: center; align-items: flex-end;
      pointer-events: none;
    }
  /* Caption pill */
  #caption-pill {
    max-width: 960px;
    padding: 12px 24px;
    border-radius: 10px;
    background: rgba(10,14,26,0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #f0f4ff;
    font: 600 30px/1.4 'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  #caption-pill .w {
    display: inline-block;
    margin: 0 3px;
    opacity: 0;
  }
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-duration="2.400" data-width="1080" data-height="1920">
  
  <div id="panel">
    <div id="content">

      <div class="pk-lt" style="position:absolute;left:60px;right:60px;top:150px;
           display:flex;align-items:stretch;gap:26px;padding:34px 40px;border-radius:26px;
           background:rgba(18,22,31,0.72);backdrop-filter:blur(24px) saturate(150%);
           -webkit-backdrop-filter:blur(24px) saturate(150%);border:1px solid rgba(255,255,255,0.10);
           box-shadow:0 22px 70px rgba(0,0,0,0.55),inset 0 1px 0 rgba(255,255,255,0.06);">
        <span class="pk-tick" style="flex:0 0 auto;width:6px;border-radius:3px;
             background:linear-gradient(to bottom,#4da3ff,#37e0d8);box-shadow:0 0 20px #4da3ff;"></span>
        <div style="display:flex;flex-direction:column;justify-content:center;gap:14px;">
          <div style="display:flex;align-items:center;gap:20px;">
            <span style="font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,monospace;font-size:28px;color:#7f8798;">02</span>
            <span class="pk-lab" style="font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,monospace;font-weight:700;font-size:40px;letter-spacing:0.12em;
                 text-transform:uppercase;color:#eef2f9;">TASK</span>
          </div>
          <span class="pk-val" style="font-family:Inter,'SF Pro Display','Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:40px;color:#7f8798;">3 lesser-known sites + era + address</span>
        </div>
      </div>
    
    </div>
  </div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
(function () {
  var vars = window.__hyperframes && window.__hyperframes.getVariables
    ? window.__hyperframes.getVariables() : {};
  var tl = gsap.timeline();
  var root = document.getElementById('content');

  /* ── Claude's content timeline (scoped to #content) ── */
  (function (tl, root, vars) {

      const lt=root.querySelector('.pk-lt'),tick=root.querySelector('.pk-tick');
      gsap.set(lt,{opacity:0,x:-40});
      if(tick) gsap.set(tick,{scaleY:0,transformOrigin:'top'});
      tl.to(lt,{opacity:1,x:0,duration:0.55,ease:'power3.out'},0.1);
      if(tick) tl.to(tick,{scaleY:1,duration:0.5,ease:'power3.inOut'},0.2);
      tl.to(lt,{opacity:0,duration:0.3,ease:'power2.in'},2.02);
    
  })(tl, root, vars);

  /* ── Caption timeline (Python-owned) ── */
  (function (tl) {

  })(tl);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
