<!DOCTYPE html>
<html data-composition-fps="30" data-composition-duration="105" data-composition-variables='{"caption_text": {"type": "string", "default": "i stopped googling travel guides i interrogated an ai instead"}, "niche_color": {"type": "string", "default": "#3b82f6"}}'>
<head>
<meta charset="utf-8">
<style>
  /* === Python-owned base === */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1920px;
    background: transparent;
    overflow: hidden;
  }
  #main {
    position: relative;
    width: 1080px; height: 1920px;
    overflow: hidden;
  }
  
    /* === Fullscreen layout === */
    #panel {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #content {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
  
    /* Fullscreen ambient background */
    #ambient {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 15% 30%, rgba(59,130,246,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 70% at 85% 75%, rgba(139,92,246,0.09) 0%, transparent 60%),
        #0a0e1a;
    }
  
    /* === Python-owned caption (fullscreen) === */
    #caption-layer {
      position: absolute;
      left: 0; right: 0;
      bottom: 80px;
      display: flex; justify-content: center; align-items: flex-end;
      pointer-events: none;
    }
  /* Caption pill */
  #caption-pill {
    max-width: 1020px;
    padding: 12px 24px;
    border-radius: 10px;
    background: rgba(10,14,26,0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #f0f4ff;
    font: 600 30px/1.4 'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  #caption-pill .w {
    display: inline-block;
    margin: 0 3px;
    opacity: 0;
  }
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-duration="3.500" data-width="1080" data-height="1920">
    
  <div id="panel">
    <div id="content">

      <div class='pk-scrim' style="position:absolute;left:0;right:0;top:0;height:760px;pointer-events:none;background:linear-gradient(to top,transparent 0%,rgba(4,6,10,0.45) 46%,rgba(4,6,10,0.9) 100%);"></div>
      <div class='pk-kick' style="position:absolute;top:190px;left:84px;display:flex;align-items:center;gap:16px;"><span style="width:46px;height:2px;background:#4da3ff;box-shadow:0 0 14px #4da3ff;"></span><span style="font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,monospace;font-size:26px;letter-spacing:0.42em;text-transform:uppercase;color:#7f8798;font-weight:600;">Prompt Anatomy</span></div>
      <div class="pk-l1" style="position:absolute;top:250px;left:84px;width:912px;
           font-family:Inter,'SF Pro Display','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:52px;letter-spacing:-0.02em;color:#7f8798;">One prompt.</div>
      <div class="pk-rule" style="position:absolute;top:332px;left:84px;width:0px;height:2px;
           background:linear-gradient(to right,#4da3ff,transparent);box-shadow:0 0 16px #4da3ff;"></div>
      <div class="pk-l2" style="position:absolute;top:360px;left:84px;width:940px;
           font-family:Inter,'SF Pro Display','Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:104px;line-height:0.98;letter-spacing:-0.04em;color:#eef2f9;">
        A private <span class="pk-accent" style="color:#4da3ff;">historian.</span></div>
    
    </div>
  </div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
(function () {
  var vars = window.__hyperframes && window.__hyperframes.getVariables
    ? window.__hyperframes.getVariables() : {};
  var tl = gsap.timeline();
  var root = document.getElementById('content');

  /* ── Claude's content timeline (scoped to #content) ── */
  (function (tl, root, vars) {

      const k=root.querySelector('.pk-kick'),
            l1=root.querySelector('.pk-l1'),ru=root.querySelector('.pk-rule'),
            l2=root.querySelector('.pk-l2');
      gsap.set(k,{opacity:0,x:-18});
      gsap.set(l1,{opacity:0,y:22,filter:'blur(8px)'});
      gsap.set(l2,{opacity:0,y:30,filter:'blur(12px)'});
      tl.to(k,{opacity:1,x:0,duration:0.6,ease:'power3.out'},0.15);
      tl.to(l1,{opacity:1,y:0,filter:'blur(0px)',duration:0.6,ease:'power3.out'},0.4);
      tl.to(ru,{width:220,duration:0.7,ease:'power3.inOut'},0.65);
      tl.to(l2,{opacity:1,y:0,filter:'blur(0px)',duration:0.75,ease:'power3.out'},0.8);
    
  })(tl, root, vars);

  /* ── Caption timeline (Python-owned) ── */
  (function (tl) {

  })(tl);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
