<!DOCTYPE html>
<html data-composition-fps="30" data-composition-duration="159" data-composition-variables='{"caption_text": {"type": "string", "default": "roll historian not chatbot task three lesser known sites"}, "niche_color": {"type": "string", "default": "#3b82f6"}}'>
<head>
<meta charset="utf-8">
<style>
  /* === Python-owned base === */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1920px;
    background: transparent;
    overflow: hidden;
  }
  #main {
    position: relative;
    width: 1080px; height: 1920px;
    overflow: hidden;
  }
  
    /* === Python-owned panel geometry === */
    #panel {
      position: absolute;
      left: 140px; top: 20px;
      width: 800px; height: 100px;
      overflow: hidden;
      border-radius: 50px;
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border: 0;
      box-shadow: none;
    }
    /* Specular highlight at panel top edge */
    #panel::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(to right, transparent, transparent, transparent);
      z-index: 100;
    }
    /* Claude's content is scoped here. (0,0) = panel top-left. */
    #content {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
  
  
    /* === Python-owned caption (sibling of #panel, never clipped) === */
    #caption-layer {
      position: absolute;
      left: 0px; width: 1080px;
      bottom: 80px;
      display: flex; justify-content: center; align-items: flex-end;
      pointer-events: none;
    }
  /* Caption pill */
  #caption-pill {
    max-width: 960px;
    padding: 12px 24px;
    border-radius: 10px;
    background: rgba(10,14,26,0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #f0f4ff;
    font: 600 30px/1.4 'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  #caption-pill .w {
    display: inline-block;
    margin: 0 3px;
    opacity: 0;
  }
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-duration="5.300" data-width="1080" data-height="1920">
  
  <div id="panel">
    <div id="content">

      <div class="pk-pill" style="position:absolute;top:6px;left:6px;width:788px;height:88px;
           display:flex;align-items:center;gap:20px;padding:0 30px;border-radius:100px;
           background:rgba(18,22,31,0.72);backdrop-filter:blur(20px) saturate(160%);
           -webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid rgba(255,255,255,0.10);
           box-shadow:0 10px 40px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.07);">
        <span class="pk-num" style="flex:0 0 auto;display:flex;align-items:center;justify-content:center;
             width:52px;height:52px;border-radius:16px;background:#4da3ff;color:#04121f;
             font-family:Inter,'SF Pro Display','Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:30px;box-shadow:0 0 22px rgba(77,163,255,0.55);">1</span>
        <span class="pk-lab" style="font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,monospace;font-weight:700;font-size:30px;letter-spacing:0.14em;
             text-transform:uppercase;color:#eef2f9;white-space:nowrap;">ROLE</span>
        <span style="width:1px;height:38px;background:rgba(255,255,255,0.10);"></span>
        <span class="pk-val" style="font-family:Inter,'SF Pro Display','Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:29px;color:#7f8798;
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">historian, not chatbot</span>
      </div>
    
    </div>
  </div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
(function () {
  var vars = window.__hyperframes && window.__hyperframes.getVariables
    ? window.__hyperframes.getVariables() : {};
  var tl = gsap.timeline();
  var root = document.getElementById('content');

  /* ── Claude's content timeline (scoped to #content) ── */
  (function (tl, root, vars) {

      const pill=root.querySelector('.pk-pill'),num=root.querySelector('.pk-num'),
            lab=root.querySelector('.pk-lab'),val=root.querySelector('.pk-val');
      gsap.set(pill,{opacity:0,y:-22,scale:0.96});
      gsap.set(num,{scale:0.3,opacity:0});
      gsap.set([lab,val],{opacity:0,x:-10});
      tl.to(pill,{opacity:1,y:0,scale:1,duration:0.5,ease:'power3.out'},0.08);
      tl.to(num,{scale:1,opacity:1,duration:0.45,ease:'back.out(2)'},0.28);
      tl.to(lab,{opacity:1,x:0,duration:0.4,ease:'power2.out'},0.42);
      tl.to(val,{opacity:1,x:0,duration:0.4,ease:'power2.out'},0.54);
      tl.to(pill,{opacity:0,duration:0.25,ease:'power2.in'},5.00);
    
  })(tl, root, vars);

  /* ── Caption timeline (Python-owned) ── */
  (function (tl) {

  })(tl);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
