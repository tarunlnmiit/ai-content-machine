<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Nunito+Sans:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1280px; height: 720px; overflow: hidden; }

    .thumbnail {
      width: 1280px;
      height: 720px;
      position: relative;
      overflow: hidden;
      background: #1E1B2E;
      font-family: 'Nunito Sans', sans-serif;
    }

    /* Background glow behind the 5 */
    .glow-left {
      position: absolute;
      width: 680px;
      height: 680px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(232,112,90,0.22) 0%, rgba(232,112,90,0.06) 45%, transparent 70%);
      left: -160px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 1;
    }

    .glow-right {
      position: absolute;
      width: 440px;
      height: 440px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(239,149,133,0.07) 0%, transparent 70%);
      right: 40px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 1;
    }

    /* Concentric loop rings — reinforce "loops" concept */
    .ring {
      position: absolute;
      border-radius: 50%;
      border-style: solid;
      z-index: 2;
      top: 50%;
      transform: translateY(-50%);
    }
    .ring-1 {
      width: 760px; height: 760px;
      border: 1px solid rgba(232,112,90,0.07);
      left: -240px;
    }
    .ring-2 {
      width: 570px; height: 570px;
      border: 1px solid rgba(232,112,90,0.11);
      left: -145px;
    }
    .ring-3 {
      width: 380px; height: 380px;
      border: 2px solid rgba(232,112,90,0.18);
      left: -50px;
    }

    /* Dot grid — right half texture */
    .dot-grid {
      position: absolute;
      right: 0; top: 0;
      width: 860px; height: 720px;
      background-image: radial-gradient(circle, rgba(232,112,90,0.09) 1.5px, transparent 1.5px);
      background-size: 42px 42px;
      z-index: 3;
      -webkit-mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,0.5) 25%, rgba(0,0,0,0.5) 80%, transparent 100%);
      mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,0.5) 25%, rgba(0,0,0,0.5) 80%, transparent 100%);
    }

    /* Vertical divider */
    .divider {
      position: absolute;
      left: 460px; top: 0;
      width: 2px; height: 100%;
      background: linear-gradient(to bottom,
        transparent 0%,
        rgba(232,112,90,0.2) 15%,
        rgba(232,112,90,0.55) 50%,
        rgba(232,112,90,0.2) 85%,
        transparent 100%);
      z-index: 10;
    }

    /* ── LEFT PANEL ── */
    .left-panel {
      position: absolute;
      left: 0; top: 0;
      width: 460px; height: 720px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    .big-number {
      font-family: 'Lora', serif;
      font-size: 340px;
      font-weight: 700;
      color: #E8705A;
      line-height: 0.82;
      letter-spacing: -8px;
      text-shadow:
        0 0 60px rgba(232,112,90,0.7),
        0 0 120px rgba(232,112,90,0.3),
        0 0 200px rgba(232,112,90,0.12);
    }

    .number-sub {
      font-family: 'Nunito Sans', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 8px;
      color: rgba(255,255,255,0.38);
      text-transform: uppercase;
      margin-top: 14px;
    }

    /* ── RIGHT PANEL ── */
    .right-panel {
      position: absolute;
      left: 480px; right: 0;
      top: 0; height: 720px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 0 55px;
      z-index: 20;
    }

    .main-headline {
      font-family: 'Nunito Sans', sans-serif;
      font-size: 148px;
      font-weight: 900;
      color: #FFFFFF;
      line-height: 0.88;
      letter-spacing: -5px;
      text-shadow: 0 6px 40px rgba(0,0,0,0.7);
    }

    .accent-bar {
      width: 72px;
      height: 5px;
      background: #E8705A;
      border-radius: 3px;
      margin: 26px 0 22px;
      box-shadow: 0 0 16px rgba(232,112,90,0.5);
    }

    .sub-line-1 {
      font-family: 'Nunito Sans', sans-serif;
      font-size: 38px;
      font-weight: 900;
      color: #EF9585;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1;
    }

    .sub-line-2 {
      font-family: 'Lora', serif;
      font-size: 30px;
      font-weight: 700;
      font-style: italic;
      color: rgba(255,255,255,0.55);
      margin-top: 8px;
      letter-spacing: 0;
      line-height: 1.2;
    }

    /* Loop arrow icon — bottom-right subtle reinforcement */
    .loop-svg {
      position: absolute;
      right: 44px;
      bottom: 58px;
      z-index: 15;
      opacity: 0.45;
    }

    /* ── BRAND MARK ── */
    .brand-mark {
      position: absolute;
      bottom: 22px;
      left: 26px;
      display: flex;
      align-items: center;
      gap: 9px;
      z-index: 30;
    }

    .brand-circle {
      width: 28px;
      height: 28px;
      background: #E8705A;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      color: #fff;
      font-family: 'Nunito Sans', sans-serif;
      flex-shrink: 0;
    }

    .brand-handle {
      font-size: 13px;
      color: rgba(255,255,255,0.38);
      font-family: 'Nunito Sans', sans-serif;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="thumbnail">

    <!-- BG depth -->
    <div class="glow-left"></div>
    <div class="glow-right"></div>
    <div class="dot-grid"></div>

    <!-- Concentric rings -->
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="ring ring-3"></div>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- Left: giant 5 -->
    <div class="left-panel">
      <span class="big-number">5</span>
      <span class="number-sub">things</span>
    </div>

    <!-- Right: text -->
    <div class="right-panel">
      <div class="main-headline">LOOPS</div>
      <div class="accent-bar"></div>
      <div class="sub-line-1">Growth that</div>
      <div class="sub-line-2">runs itself</div>
    </div>

    <!-- Subtle loop icon -->
    <div class="loop-svg">
      <svg width="76" height="76" viewBox="0 0 76 76" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M38 6C20.3 6 6 20.3 6 38s14.3 32 32 32 32-14.3 32-32S55.7 6 38 6z" stroke="#EF9585" stroke-width="2.5" stroke-dasharray="8 5"/>
        <path d="M60 22l10 6-10 6" stroke="#EF9585" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <!-- Brand mark -->
    <div class="brand-mark">
      <div class="brand-circle">B</div>
      <span class="brand-handle">@mistakenlyhuman</span>
    </div>

  </div>
</body>
</html>
