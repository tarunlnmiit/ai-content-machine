<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Tweet Post</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1080px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #F0F0F0 0%, #E8EDF2 100%);
    font-family: 'Inter', sans-serif;
  }
  .card {
    background: #fff;
    width: 880px;
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    overflow: hidden;
  }
  .top-bar {
    padding: 20px 24px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .profile-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #E8705A;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 20px;
    flex-shrink: 0;
  }
  .profile-text { display: flex; flex-direction: column; gap: 2px; }
  .display-name { font-size: 17px; font-weight: 700; color: #0F1419; line-height: 1.2; }
  .handle { font-size: 14px; color: #536471; line-height: 1.2; }
  .x-logo { flex-shrink: 0; }
  .tweet-text {
    padding: 16px 24px;
    font-size: 22px;
    color: #0F1419;
    line-height: 1.55;
  }
  .timestamp {
    padding: 0 24px 16px;
    font-size: 14px;
    color: #536471;
  }
  hr {
    border: none;
    border-top: 1px solid #EFF3F4;
  }
  .metrics {
    padding: 14px 24px;
    font-size: 14px;
    color: #536471;
  }
  .metrics span {
    color: #0F1419;
    font-weight: 600;
  }
  .actions {
    padding: 8px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .action-icon {
    color: #536471;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
  }
</style>
</head>
<body>
<div class="card">

  <div class="top-bar">
    <div class="profile-row">
      <div class="avatar">BL</div>
      <div class="profile-text">
        <span class="display-name">Breath of Life</span>
        <span class="handle">@mistakenlyhuman</span>
      </div>
    </div>
    <svg class="x-logo" width="22" height="22" viewBox="0 0 22 22" fill="#0F1419" xmlns="http://www.w3.org/2000/svg">
      <path d="M13.144 9.336L20.4 1H18.64L12.37 8.247L7.37 1H1.6L9.216 12.113L1.6 21H3.36L9.987 13.349L15.23 21H21L13.144 9.336ZM10.865 12.344L10.09 11.242L3.99 2.3H6.54L11.555 9.277L12.33 10.38L18.64 19.762H16.09L10.865 12.344Z"/>
    </svg>
  </div>

  <div class="tweet-text">
    After consuming something, ask yourself: do I know something new, or do I see something differently? The second one compounds. The first one evaporates.
  </div>

  <div class="timestamp">Jun 17, 2026 · X for iPhone</div>

  <hr>

  <div class="metrics">
    <span>847</span> Likes &nbsp;·&nbsp; <span>312</span> Reposts &nbsp;·&nbsp; <span>94.2K</span> Views
  </div>

  <hr>

  <div class="actions">
    <!-- Reply -->
    <div class="action-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#536471" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </div>
    <!-- Repost -->
    <div class="action-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#536471" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="17 1 21 5 17 9"/>
        <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
        <polyline points="7 23 3 19 7 15"/>
        <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
      </svg>
    </div>
    <!-- Like -->
    <div class="action-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#536471" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
    </div>
    <!-- Bookmark -->
    <div class="action-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#536471" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
      </svg>
    </div>
    <!-- Share -->
    <div class="action-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#536471" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"/>
        <circle cx="6" cy="12" r="3"/>
        <circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
      </svg>
    </div>
  </div>

</div>
</body>
</html>
