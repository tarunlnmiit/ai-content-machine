<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Tweet Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1080px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #F0F0F0 0%, #E8EDF2 100%);
    font-family: 'Inter', sans-serif;
  }
  .card {
    background: #fff;
    width: 880px;
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    overflow: hidden;
  }
  .top-bar {
    display: flex;
    align-items: center;
    padding: 20px 24px 0;
    position: relative;
  }
  .avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #B89850;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .avatar span {
    color: #fff;
    font-weight: 700;
    font-size: 20px;
    line-height: 1;
    letter-spacing: -0.5px;
  }
  .account-info {
    margin-left: 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .display-name {
    font-size: 17px;
    font-weight: 700;
    color: #0F1419;
    line-height: 1.3;
  }
  .handle {
    font-size: 14px;
    color: #536471;
    line-height: 1.3;
  }
  .x-logo {
    position: absolute;
    right: 24px;
    top: 20px;
  }
  .tweet-text {
    padding: 16px 24px;
    font-size: 22px;
    color: #0F1419;
    line-height: 1.55;
  }
  .timestamp {
    padding: 0 24px 16px;
    font-size: 14px;
    color: #536471;
  }
  .divider {
    border: none;
    border-top: 1px solid #EFF3F4;
    margin: 0;
  }
  .metrics {
    padding: 14px 24px;
    font-size: 14px;
    color: #536471;
  }
  .metrics strong {
    color: #0F1419;
    font-weight: 600;
  }
  .actions-row {
    padding: 8px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .action-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
  }
</style>
</head>
<body>
  <div class="card">
    <!-- Top bar -->
    <div class="top-bar">
      <div class="avatar"><span>BP</span></div>
      <div class="account-info">
        <span class="display-name">Breath of Poetry</span>
        <span class="handle">@mistakenlyhuman</span>
      </div>
      <!-- X logo -->
      <div class="x-logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#0F1419" xmlns="http://www.w3.org/2000/svg">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.253 5.622 5.912-5.622Zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
      </div>
    </div>

    <!-- Tweet text -->
    <div class="tweet-text">
      The self-consciousness only goes away inside the doing. Not before it. Not after. Only while you're actually in it — fumbling, imperfect, moving anyway.
    </div>

    <!-- Timestamp -->
    <div class="timestamp">Jun 17, 2026 · X for iPhone</div>

    <hr class="divider">

    <!-- Metrics -->
    <div class="metrics">
      <strong>847</strong> Likes &nbsp;·&nbsp; <strong>312</strong> Reposts &nbsp;·&nbsp; <strong>94.2K</strong> Views
    </div>

    <hr class="divider">

    <!-- Actions row -->
    <div class="actions-row">
      <!-- Reply -->
      <div class="action-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#536471" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <!-- Repost -->
      <div class="action-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#536471" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="17 1 21 5 17 9"/>
          <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
          <polyline points="7 23 3 19 7 15"/>
          <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </svg>
      </div>
      <!-- Like -->
      <div class="action-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#536471" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </div>
      <!-- Bookmark -->
      <div class="action-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#536471" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <!-- Share -->
      <div class="action-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#536471" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"/>
          <circle cx="6" cy="12" r="3"/>
          <circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
